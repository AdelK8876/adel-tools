<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shift & Prayer Times</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f4ef;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .clock-block { margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    #clock { font-size: 34px; font-weight: 600; letter-spacing: -0.5px; color: #1a1a1a; }
    #date-line { font-size: 13px; color: #666; margin-top: 3px; }
    .badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 500; display: inline-block; }
    .badge-work { background: #d4edda; color: #1e6933; }
    .badge-off  { background: #fde8df; color: #a03010; }
    .badge-next { background: #fef3cd; color: #856404; }
    .badge-done { background: #ebebeb; color: #888; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
    .metric { background: #eeecea; border-radius: 10px; padding: 10px 12px; }
    .metric .label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .metric .val   { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .section-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: .07em; margin: 1.2rem 0 8px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; }
    .alarm-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
    .alarm-row:last-child { border-bottom: none; }
    .alarm-row.current-row { background: #f7f6f0; border-radius: 8px; margin: 0 -6px; padding: 9px 6px; }
    .row-left { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green  { background: #2e9e5f; }
    .dot-amber  { background: #c47d15; }
    .dot-gray   { background: #aaa; }
    .dot-teal   { background: #1D9E75; }
    .row-label  { font-size: 14px; color: #1a1a1a; }
    .row-ar     { font-size: 12px; color: #aaa; margin-left: 4px; }
    .alarm-tag  { font-size: 10px; color: #2e9e5f; margin-left: 6px; }
    .time-val   { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .row-right  { display: flex; align-items: center; gap: 8px; }
    .notif-btn { font-size: 13px; border: 1px solid #d0d0d0; background: #f5f5f5; color: #333; border-radius: 8px; padding: 7px 16px; cursor: pointer; transition: background .15s; }
    .notif-btn:hover { background: #ebebeb; }
    .notif-btn.enabled { border-color: #2e9e5f; color: #1e6933; background: #d4edda; }
    #notif-status { font-size: 12px; color: #888; margin-bottom: 10px; }
    .week-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .week-pill { font-size: 12px; padding: 4px 11px; border-radius: 20px; background: #eeecea; color: #666; }
    .week-pill.work { background: #d4edda; color: #1e6933; }
    .week-pill.today { font-weight: 600; outline: 2px solid #1a1a1a; outline-offset: 1px; }
    .week-pill.off  { background: #fde8df; color: #a03010; }
    .footer { font-size: 11px; color: #bbb; text-align: center; margin-top: 2rem; }
  </style>
</head>
<body>
<div class="container">

  <div class="clock-block">
    <div>
      <div id="clock">--:--:--</div>
      <div id="date-line">Loading...</div>
    </div>
    <div style="text-align:right">
      <span id="day-badge" class="badge">--</span>
      <div id="shift-status" style="font-size:12px;color:#888;margin-top:6px;">--</div>
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric"><div class="label">Shift start</div><div class="val">2:00 PM</div></div>
    <div class="metric"><div class="label">Shift end</div><div class="val">11:00 PM</div></div>
    <div class="metric"><div class="label">Next alarm in</div><div id="next-countdown" class="val">--</div></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <div class="section-label" style="margin:0">Prayer times — Cairo</div>
    <button class="notif-btn" id="notif-btn" onclick="requestNotifications()">Enable alarms</button>
  </div>
  <div id="notif-status"></div>

  <div class="card" id="prayers-list">
    <div style="color:#aaa;font-size:13px;">Fetching prayer times...</div>
  </div>

  <div class="section-label">Shift alarms</div>
  <div class="card">
    <div class="alarm-row"><div class="row-left"><span class="dot dot-amber"></span><span class="row-label">30 min before shift</span></div><span class="time-val">1:30 PM</span></div>
    <div class="alarm-row"><div class="row-left"><span class="dot dot-green"></span><span class="row-label">Shift starts</span></div><span class="time-val">2:00 PM</span></div>
    <div class="alarm-row"><div class="row-left"><span class="dot dot-gray"></span><span class="row-label">Shift ends</span></div><span class="time-val">11:00 PM</span></div>
  </div>

  <div class="section-label">Your week</div>
  <div class="card" style="padding:10px 1.25rem;">
    <div class="week-pills" id="week-pills">
      <span class="week-pill" id="wd-0">Sun</span>
      <span class="week-pill off" id="wd-1">Mon</span>
      <span class="week-pill off" id="wd-2">Tue</span>
      <span class="week-pill work" id="wd-3">Wed</span>
      <span class="week-pill work" id="wd-4">Thu</span>
      <span class="week-pill work" id="wd-5">Fri</span>
      <span class="week-pill work" id="wd-6">Sat</span>
    </div>
  </div>

  <div class="footer">📍 Cairo · Shift: Wed – Sun · Off: Mon & Tue</div>
</div>

<script>
  const WORK_DAYS = [0,3,4,5,6];
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const PRAYERS = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
  const PRAYER_AR = {Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
  const ALARM_PRAYERS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  let prayerTimes = {}, firedAlarms = new Set(), notifGranted = false;

  function pad(n){ return String(n).padStart(2,'0'); }
  function toMins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  function toDisplay(mins){ const h=Math.floor(mins/60)%24,m=mins%60,ap=h>=12?'PM':'AM',h12=h%12||12; return `${h12}:${pad(m)} ${ap}`; }
  function toKey(now){ return `${pad(now.getHours())}:${pad(now.getMinutes())}`; }

  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date-line').textContent = `${DAY_NAMES[now.getDay()]}, ${now.getDate()} ${mo[now.getMonth()]} ${now.getFullYear()}`;
    const isWork = WORK_DAYS.includes(now.getDay());
    const b = document.getElementById('day-badge');
    b.textContent = isWork ? 'Work day' : 'Day off';
    b.className = 'badge ' + (isWork ? 'badge-work' : 'badge-off');
    document.getElementById('shift-status').textContent = isWork ? '2:00 PM – 11:00 PM' : 'Rest & recharge ☕';
    updateWeek(now.getDay());
    updatePrayerHighlight(now);
    updateCountdown(now);
    checkAlarms(now);
  }

  function updateWeek(today){
    for(let i=0;i<7;i++){
      const el = document.getElementById('wd-'+i);
      el.className = 'week-pill' + (WORK_DAYS.includes(i)?' work':(i===1||i===2?' off':'')) + (i===today?' today':'');
    }
    document.getElementById('wd-0').className = 'week-pill' + (WORK_DAYS.includes(0)?' work':'') + (0===today?' today':'');
  }

  function updatePrayerHighlight(now){
    if(!Object.keys(prayerTimes).length) return;
    const nowMins = now.getHours()*60+now.getMinutes();
    let nextP=null, nextMins=Infinity;
    PRAYERS.forEach(p=>{
      if(!prayerTimes[p]) return;
      const pm=toMins(prayerTimes[p]);
      if(pm>nowMins && pm<nextMins){ nextMins=pm; nextP=p; }
    });
    PRAYERS.forEach(p=>{
      const row=document.getElementById('pr-'+p);
      const badge=document.getElementById('pb-'+p);
      if(!row||!badge) return;
      const pm=toMins(prayerTimes[p]);
      row.classList.remove('current-row');
      if(pm<=nowMins){ badge.textContent='Done'; badge.className='badge badge-done'; }
      else if(p===nextP){ row.classList.add('current-row'); badge.textContent='Next'; badge.className='badge badge-next'; }
      else { badge.textContent=''; badge.className='badge'; }
    });
  }

  function updateCountdown(now){
    const nm = now.getHours()*60+now.getMinutes();
    let cands=[13*60+30,14*60,23*60];
    ALARM_PRAYERS.forEach(p=>{ if(prayerTimes[p]) cands.push(toMins(prayerTimes[p])); });
    cands=cands.filter(m=>m>nm).sort((a,b)=>a-b);
    if(!cands.length){ document.getElementById('next-countdown').textContent='--'; return; }
    const diff=cands[0]-nm, h=Math.floor(diff/60), m=diff%60;
    document.getElementById('next-countdown').textContent=h>0?`${h}h ${m}m`:`${m}m`;
  }

  function checkAlarms(now){
    if(!notifGranted) return;
    const key=toKey(now);
    if(firedAlarms.has(key)) return;
    const fixed={'13:30':{title:'⏰ Shift reminder',body:'Your shift starts in 30 minutes (2:00 PM)'},'14:00':{title:'✅ Shift started',body:'Your shift has started. Have a great day!'},'23:00':{title:'🔴 Shift ended',body:'Your shift is over. Time to rest!'}};
    if(fixed[key]){ new Notification(fixed[key].title,{body:fixed[key].body}); firedAlarms.add(key); }
    ALARM_PRAYERS.forEach(p=>{
      if(prayerTimes[p]&&prayerTimes[p]===key){ new Notification(`🕌 ${p} prayer time`,{body:`It is time for ${p} — ${PRAYER_AR[p]}`}); firedAlarms.add(key); }
    });
  }

  async function fetchPrayers(){
    const now=new Date();
    const date=`${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`;
    try {
      const res=await fetch(`https://api.aladhan.com/v1/timings/${date}?latitude=30.0444&longitude=31.2357&method=5`);
      const json=await res.json();
      if(json.code===200){
        const t=json.data.timings;
        PRAYERS.forEach(p=>{ if(t[p]) prayerTimes[p]=t[p].split(' ')[0]; });
        renderPrayers();
      }
    } catch(e){
      document.getElementById('prayers-list').innerHTML='<div style="color:#aaa;font-size:13px;">Could not load prayer times. Check your internet connection.</div>';
    }
  }

  function renderPrayers(){
    document.getElementById('prayers-list').innerHTML=PRAYERS.map(p=>{
      if(!prayerTimes[p]) return '';
      const isAlarm=ALARM_PRAYERS.includes(p);
      return `<div class="alarm-row" id="pr-${p}">
        <div class="row-left">
          <span class="dot ${isAlarm?'dot-teal':'dot-gray'}"></span>
          <span class="row-label">${p}<span class="row-ar">${PRAYER_AR[p]}</span></span>
          ${isAlarm?'<span class="alarm-tag">alarm</span>':''}
        </div>
        <div class="row-right">
          <span class="time-val">${toDisplay(toMins(prayerTimes[p]))}</span>
          <span class="badge" id="pb-${p}"></span>
        </div>
      </div>`;
    }).join('');
    updatePrayerHighlight(new Date());
  }

  function requestNotifications(){
    if(!('Notification' in window)){ document.getElementById('notif-status').textContent='Notifications not supported in this browser.'; return; }
    Notification.requestPermission().then(p=>{
      notifGranted=p==='granted';
      const btn=document.getElementById('notif-btn');
      const st=document.getElementById('notif-status');
      if(notifGranted){
        btn.textContent='✓ Alarms enabled';
        btn.classList.add('enabled');
        st.textContent='You will receive alarms for all prayers, 30-min warning, shift start & shift end.';
        st.style.color='#1e6933';
      } else {
        st.textContent='Permission denied. Go to Chrome Settings → Site Settings → Notifications and allow this page.';
        st.style.color='#a03010';
      }
    });
  }

  if(Notification.permission==='granted') notifGranted=true;
  fetchPrayers();
  setInterval(fetchPrayers,3600000);
  updateClock();
  setInterval(updateClock,1000);
</script>
</body>
</html>
