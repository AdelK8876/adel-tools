<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Case Tracker — Wego Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f2044; --navy2:#162d5c; --blue:#1a56db; --blue2:#1e40af;
  --teal:#0891b2; --green:#059669; --green2:#047857; --amber:#d97706; --red:#dc2626;
  --purple:#7c3aed; --orange:#ea580c;
  --bg:#f0f4f8; --card:#ffffff; --border:#dde3ec; --text:#1e293b;
  --muted:#64748b; --light:#f8fafc; --sidebar:#0f2044;
  --sidebar-w:265px;
  --shadow-sm:0 1px 3px rgba(15,32,68,.06);
  --shadow-md:0 4px 12px rgba(15,32,68,.08);
  --shadow-lg:0 12px 32px rgba(15,32,68,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}
.mono{font-family:'JetBrains Mono',monospace}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar-w);background:var(--sidebar);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,.2);transition:transform .25s}
#sb-head{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#sb-head .logo{color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
#sb-head .logo span{background:linear-gradient(135deg,#059669,#10b981);padding:5px 9px;border-radius:6px;font-size:12px}
#sb-head .sub{color:rgba(255,255,255,.4);font-size:10.5px;margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
#sb-nav{flex:1;overflow-y:auto;padding:10px 0}
#sb-nav::-webkit-scrollbar{width:3px}
#sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.nav-section{padding:14px 16px 6px;font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;color:rgba(255,255,255,.78);font-size:13px;font-weight:500}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:rgba(16,185,129,.18);border-left-color:#10b981;color:#fff;font-weight:600}
.nav-btn .nb-icon{font-size:15px;width:20px;text-align:center}
.nav-btn .nb-count{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:2px 7px;border-radius:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.nav-btn.active .nb-count{background:rgba(16,185,129,.3);color:#fff}
.nav-btn.has-alert .nb-count{background:rgba(220,38,38,.3);color:#fca5a5}

/* mobile */
#mobile-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--navy);color:#fff;border:none;width:40px;height:40px;border-radius:8px;font-size:18px;cursor:pointer;box-shadow:var(--shadow-md)}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}

/* ── MAIN ── */
#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.tb-title{font-size:15px;font-weight:700;color:var(--navy)}
.tb-sub{font-size:11px;color:var(--muted);margin-top:1px}
.search-box{flex:1;min-width:220px;max-width:380px;position:relative}
.search-box input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:var(--light);transition:all .15s}
.search-box input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(5,150,105,.12)}
.search-box::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.tb-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;border:none;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-ghost{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 11px;font-size:11.5px}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:var(--green2)}

/* ── DASHBOARD STATS ── */
#content{padding:22px 24px;flex:1;max-width:1200px;margin:0 auto;width:100%}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:all .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .accent{position:absolute;top:0;left:0;height:3px;width:100%;background:var(--accent,var(--blue))}
.stat-card .label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--navy);line-height:1.1;letter-spacing:-.02em}
.stat-card .meta{font-size:11px;color:var(--muted);margin-top:3px}
.stat-card.alert .value{color:var(--red)}
.stat-card.alert{background:linear-gradient(to bottom,#fef2f2,#fff)}

/* Hot banner for overdue */
.hot-banner{background:linear-gradient(135deg,#dc2626,#ea580c);color:#fff;padding:11px 18px;border-radius:11px;display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(220,38,38,.25)}
.hot-banner:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(220,38,38,.35)}
.hot-banner .icon{font-size:18px}
.hot-banner .arrow{margin-left:auto;font-size:18px}

/* ── RESULTS BAR ── */
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.results-count{font-size:12px;color:var(--muted)}
.results-count strong{color:var(--text);font-weight:700}
.sort-select{padding:7px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;background:#fff;cursor:pointer;color:var(--text);font-weight:500}
.sort-select:hover,.sort-select:focus{border-color:var(--green);outline:none}

/* ── CASE CARDS ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);background:var(--card);border:2px dashed var(--border);border-radius:14px}
.empty-state .icon{font-size:52px;opacity:.4;margin-bottom:10px}
.empty-state h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:13px;line-height:1.6;max-width:380px;margin:0 auto}

.case-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .18s;position:relative;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.case-card:hover{border-color:var(--green);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.case-card.is-overdue{border-color:#fca5a5;background:linear-gradient(to bottom,#fef2f2,#fff)}
.case-card.is-today{border-color:#fbbf24;background:linear-gradient(to bottom,#fffbeb,#fff)}
.case-card.is-resolved{opacity:.7}

.cc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:15px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
/* status pills */
.cc-status-open{background:#dbeafe;color:#1e40af}
.cc-status-pending{background:#fef3c7;color:#92400e}
.cc-status-waiting-customer{background:#e0e7ff;color:#3730a3}
.cc-status-waiting-airline{background:#ede9fe;color:#5b21b6}
.cc-status-waiting-internal{background:#fce7f3;color:#9f1239}
.cc-status-resolved{background:#d1fae5;color:#065f46}
.cc-status-cancelled{background:#f1f5f9;color:#475569}
/* priority pills */
.cc-pri-urgent{background:#fee2e2;color:#991b1b}
.cc-pri-high{background:#fed7aa;color:#9a3412}
.cc-pri-medium{background:#dbeafe;color:#1e40af}
.cc-pri-low{background:#f1f5f9;color:#64748b}
/* category pills */
.cc-cat-pill{background:#f1f5f9;color:#475569;font-weight:600;text-transform:none;letter-spacing:0;font-size:10.5px}

.cc-title{font-size:14px;font-weight:700;color:var(--navy);line-height:1.35}
.cc-meta{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.cc-meta .meta-row{display:flex;align-items:center;gap:6px}
.cc-meta .meta-row .icon{width:14px;font-size:11px;flex-shrink:0;opacity:.7}
.cc-meta .val{font-weight:600;color:var(--text)}
.cc-meta .val.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.cc-meta .val.warn{color:var(--red);font-weight:700}
.cc-meta .val.today{color:var(--amber);font-weight:700}
.cc-actions{display:flex;gap:6px;margin-top:4px;padding-top:8px;border-top:1px solid var(--border)}
.cc-action-btn{flex:1;padding:6px 10px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:11px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.cc-action-btn:hover{border-color:var(--green);color:var(--green)}
.cc-action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.cc-action-btn.success:hover{border-color:var(--green);background:var(--green);color:#fff}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,32,68,.55);z-index:300;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex;animation:fadeIn .18s}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideUp .22s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.m-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
.m-titles{flex:1;min-width:0}
.m-name{font-size:16px;font-weight:800;color:var(--navy);line-height:1.3;margin-top:6px}
.m-close{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--muted);width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-close:hover{background:#f1f5f9;color:var(--text)}
.m-body{padding:18px 20px;overflow-y:auto;flex:1}
.m-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--light);border-radius:0 0 14px 14px;flex-wrap:wrap}

/* ── DETAIL VIEW ── */
.detail-section{margin-bottom:16px}
.detail-section:last-child{margin-bottom:0}
.detail-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{padding:10px 12px;background:var(--light);border:1px solid var(--border);border-radius:8px}
.info-item .il{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.info-item .iv{font-size:13px;color:var(--text);font-weight:600;word-break:break-word}
.info-item .iv.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.info-item .iv.empty{color:#94a3b8;font-style:italic;font-weight:400}
.detail-text{font-size:13px;color:var(--text);line-height:1.6;background:var(--light);padding:11px 13px;border-radius:8px;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.detail-text.empty{color:#94a3b8;font-style:italic;border-style:dashed}

/* Notes log */
.notes-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding-right:4px}
.note-item{padding:10px 12px;background:#f8fafc;border:1px solid var(--border);border-left:3px solid var(--green);border-radius:7px}
.note-meta{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.note-meta .ts{font-family:'JetBrains Mono',monospace}
.note-text{font-size:12.5px;color:var(--text);line-height:1.55;white-space:pre-wrap}
.add-note-row{display:flex;gap:6px;margin-top:8px}
.add-note-row textarea{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12.5px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;resize:vertical;min-height:50px;line-height:1.5}
.add-note-row textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.1)}

/* ── FORM ── */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-group label{font-size:11px;font-weight:600;color:var(--text)}
.form-group label .req{color:var(--red)}
.form-group label .helper{color:var(--muted);font-weight:400;font-size:10.5px}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .15s;background:#fff;color:var(--text);width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.form-group textarea{resize:vertical;min-height:64px;line-height:1.55}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row .form-group{margin-bottom:0}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-row-3 .form-group{margin-bottom:0}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:500;display:none;animation:slideUp .22s}
.toast.show{display:block}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* ── RESPONSIVE ── */
@media (max-width:1100px){
  .stats-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none}
  #sidebar.open ~ #sidebar-backdrop{display:block}
  #main{margin-left:0}
  #mobile-toggle{display:flex;align-items:center;justify-content:center}
  #topbar{padding-left:60px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  #content{padding:14px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .cards-grid{grid-template-columns:1fr}
  .modal{max-height:95vh}
  .stat-card .value{font-size:22px}
}
</style>
</head>
<body>

<button id="mobile-toggle" onclick="toggleSidebar()">☰</button>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div id="sb-head">
    <div class="logo"><span>📊</span> Case Tracker</div>
    <div class="sub">Wego · Personal Pipeline</div>
  </div>
  <nav id="sb-nav"></nav>
</aside>
<div id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div>
      <div class="tb-title">Personal Case Tracker</div>
      <div class="tb-sub" id="tb-sub">— cases logged</div>
    </div>
    <div class="search-box">
      <input id="search" type="text" placeholder="Search title, customer, ref, airline…" autocomplete="off" oninput="onSearch()">
    </div>
    <div class="tb-actions">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📊 CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">📤 JSON</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">📥 Import</button>
      <input id="import-file" type="file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Case</button>
    </div>
  </div>

  <div id="content">

    <!-- HOT BANNER (only if overdue exist) -->
    <div id="hot-banner"></div>

    <!-- DASHBOARD STATS -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- RESULTS BAR -->
    <div class="results-bar">
      <div class="results-count" id="count">Loading…</div>
      <select class="sort-select" id="sort" onchange="onSort()">
        <option value="recent">Sort: Recently Updated</option>
        <option value="created-desc">Newest First</option>
        <option value="created-asc">Oldest First</option>
        <option value="followup">Follow-up Date</option>
        <option value="priority">Priority (High to Low)</option>
      </select>
    </div>

    <!-- CASE CARDS -->
    <div class="cards-grid" id="cards"></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detail-modal" onclick="if(event.target===this)closeModal('detail-modal')">
  <div class="modal" id="detail-content"></div>
</div>

<!-- FORM MODAL -->
<div class="modal-backdrop" id="form-modal" onclick="if(event.target===this)closeModal('form-modal')">
  <div class="modal">
    <div class="m-head">
      <div class="m-titles">
        <div class="m-name" id="form-title">Add Case</div>
      </div>
      <button class="m-close" onclick="closeModal('form-modal')">✕</button>
    </div>
    <div class="m-body">
      <div class="form-group">
        <label>Title <span class="req">*</span> <span class="helper">(short summary)</span></label>
        <input id="f-title" type="text" placeholder="e.g. Customer wants to cancel — flydubai LCC">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Customer Name <span class="helper">(optional)</span></label>
          <input id="f-customer" type="text" placeholder="e.g. Mr. Mohamed Edries">
        </div>
        <div class="form-group">
          <label>Booking Reference</label>
          <input id="f-ref" type="text" placeholder="WF5V3F4JE7J26" style="font-family:'JetBrains Mono',monospace">
        </div>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>Airline</label>
          <input id="f-airline" type="text" placeholder="EK or Emirates">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="f-category">
            <option value="refund">💰 Refund</option>
            <option value="cancellation">🚫 Cancellation</option>
            <option value="change">🔄 Change</option>
            <option value="schedule-change">🔔 Schedule Change</option>
            <option value="special">⚠️ Special</option>
            <option value="other" selected>📋 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="f-priority">
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="low">⚪ Low</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="open" selected>🆕 Open</option>
            <option value="pending">⏳ Pending</option>
            <option value="waiting-customer">👤 Waiting on Customer</option>
            <option value="waiting-airline">✈️ Waiting on Airline</option>
            <option value="waiting-internal">🏢 Waiting on Internal Team</option>
            <option value="resolved">✅ Resolved</option>
            <option value="cancelled">❌ Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label>Follow-up Date <span class="helper">(when to check back)</span></label>
          <input id="f-followup" type="date">
        </div>
      </div>

      <div class="form-group">
        <label>Description <span class="helper">(what's the case about)</span></label>
        <textarea id="f-description" placeholder="What did the customer say? What's the situation?"></textarea>
      </div>

      <div class="form-group">
        <label>Initial Note <span class="helper">(action taken right now — added to log)</span></label>
        <textarea id="f-initial-note" placeholder="e.g. Sent canned response 'LCC Cancellation Refusal' — customer to confirm receipt." rows="2"></textarea>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('form-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveCase()">💾 Save Case</button>
    </div>
  </div>
</div>

<!-- RESOLVE MODAL -->
<div class="modal-backdrop" id="resolve-modal" onclick="if(event.target===this)closeModal('resolve-modal')">
  <div class="modal" style="max-width:480px">
    <div class="m-head">
      <div class="m-titles"><div class="m-name">✅ Mark as Resolved</div></div>
      <button class="m-close" onclick="closeModal('resolve-modal')">✕</button>
    </div>
    <div class="m-body">
      <div class="form-group">
        <label>How was it resolved? <span class="helper">(brief outcome)</span></label>
        <textarea id="f-resolution" placeholder="e.g. Refund processed via Tabby. Customer confirmed satisfaction." rows="3"></textarea>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('resolve-modal')">Cancel</button>
      <button class="btn btn-success btn-sm" onclick="confirmResolve()">✅ Mark Resolved</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'wego_case_tracker_v1';
const TODAY_STR = () => new Date().toISOString().slice(0,10);
const NOW_ISO = () => new Date().toISOString();

const STATUSES = {
  'open':              { label:'Open',                icon:'🆕', cls:'cc-status-open',              active:true },
  'pending':           { label:'Pending',             icon:'⏳', cls:'cc-status-pending',           active:true },
  'waiting-customer':  { label:'Waiting on Customer', icon:'👤', cls:'cc-status-waiting-customer',  active:true },
  'waiting-airline':   { label:'Waiting on Airline',  icon:'✈️', cls:'cc-status-waiting-airline',   active:true },
  'waiting-internal':  { label:'Waiting Internal',    icon:'🏢', cls:'cc-status-waiting-internal',  active:true },
  'resolved':          { label:'Resolved',            icon:'✅', cls:'cc-status-resolved',          active:false },
  'cancelled':         { label:'Cancelled',           icon:'❌', cls:'cc-status-cancelled',         active:false },
};

const CATEGORIES = {
  refund:           { label:'Refund',          icon:'💰' },
  cancellation:     { label:'Cancellation',    icon:'🚫' },
  change:           { label:'Change',          icon:'🔄' },
  'schedule-change':{ label:'Schedule Change', icon:'🔔' },
  special:          { label:'Special',         icon:'⚠️' },
  other:            { label:'Other',           icon:'📋' },
};

const PRIORITIES = {
  urgent: { label:'Urgent', icon:'🔴', cls:'cc-pri-urgent', rank:4 },
  high:   { label:'High',   icon:'🟠', cls:'cc-pri-high',   rank:3 },
  medium: { label:'Medium', icon:'🟡', cls:'cc-pri-medium', rank:2 },
  low:    { label:'Low',    icon:'⚪', cls:'cc-pri-low',    rank:1 },
};

// ── STATE ──────────────────────────────────────────────────
let cases = [];
let activeFilter = 'active';
let searchQuery = '';
let sortMode = 'recent';
let editingId = null;
let resolvingId = null;

// ── INIT ───────────────────────────────────────────────────
function init(){
  const stored = localStorage.getItem(STORAGE_KEY);
  if(stored){
    try{ cases = JSON.parse(stored); }
    catch(e){ cases = []; }
  }
  renderSidebar();
  renderStats();
  renderHotBanner();
  render();
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cases));
}

// ── COMPUTED VALUES ────────────────────────────────────────
function isActive(c){ return STATUSES[c.status] && STATUSES[c.status].active; }

function isOverdue(c){
  if(!isActive(c)) return false;
  if(!c.followUpDate) return false;
  return c.followUpDate < TODAY_STR();
}

function isToday(c){
  if(!isActive(c)) return false;
  return c.followUpDate === TODAY_STR();
}

function isThisWeek(c){
  if(!isActive(c)) return false;
  if(!c.followUpDate) return false;
  const d = new Date(c.followUpDate);
  const today = new Date(TODAY_STR());
  const diffDays = Math.round((d - today) / (1000*60*60*24));
  return diffDays >= 0 && diffDays <= 7;
}

function resolvedThisWeek(c){
  if(c.status !== 'resolved' || !c.resolvedAt) return false;
  const resolved = new Date(c.resolvedAt);
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  return resolved >= weekAgo;
}

function getStats(){
  const active = cases.filter(isActive).length;
  const overdue = cases.filter(isOverdue).length;
  const today = cases.filter(isToday).length;
  const resolvedWeek = cases.filter(resolvedThisWeek).length;
  // Avg resolution time (in hours, then formatted)
  const resolved = cases.filter(c => c.status === 'resolved' && c.resolvedAt && c.createdAt);
  let avgStr = '—';
  if(resolved.length > 0){
    const totalMs = resolved.reduce((sum, c) => sum + (new Date(c.resolvedAt) - new Date(c.createdAt)), 0);
    const avgHours = totalMs / resolved.length / (1000*60*60);
    if(avgHours < 1) avgStr = Math.round(avgHours*60) + 'm';
    else if(avgHours < 48) avgStr = avgHours.toFixed(1) + 'h';
    else avgStr = (avgHours/24).toFixed(1) + 'd';
  }
  return { active, overdue, today, resolvedWeek, avg: avgStr, total: cases.length };
}

// ── HOT BANNER ─────────────────────────────────────────────
function renderHotBanner(){
  const stats = getStats();
  const wrap = document.getElementById('hot-banner');
  if(stats.overdue > 0){
    wrap.innerHTML = `<div class="hot-banner" onclick="setFilter('overdue')">
      <span class="icon">🔥</span>
      <span>You have <strong>${stats.overdue}</strong> overdue follow-up${stats.overdue===1?'':'s'} — review now</span>
      <span class="arrow">→</span>
    </div>`;
  } else {
    wrap.innerHTML = '';
  }
}

// ── DASHBOARD STATS ────────────────────────────────────────
function renderStats(){
  const s = getStats();
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card" onclick="setFilter('active')" style="--accent:var(--blue)">
      <div class="accent"></div>
      <div class="label">Active</div>
      <div class="value">${s.active}</div>
      <div class="meta">in your pipeline</div>
    </div>
    <div class="stat-card ${s.overdue>0?'alert':''}" onclick="setFilter('overdue')" style="--accent:var(--red)">
      <div class="accent"></div>
      <div class="label">Overdue</div>
      <div class="value">${s.overdue}</div>
      <div class="meta">need attention</div>
    </div>
    <div class="stat-card" onclick="setFilter('today')" style="--accent:var(--amber)">
      <div class="accent"></div>
      <div class="label">Today</div>
      <div class="value">${s.today}</div>
      <div class="meta">follow-ups due</div>
    </div>
    <div class="stat-card" onclick="setFilter('resolved')" style="--accent:var(--green)">
      <div class="accent"></div>
      <div class="label">Resolved (7d)</div>
      <div class="value">${s.resolvedWeek}</div>
      <div class="meta">last 7 days</div>
    </div>
    <div class="stat-card" style="--accent:var(--purple);cursor:default">
      <div class="accent"></div>
      <div class="label">Avg Resolution</div>
      <div class="value mono">${s.avg}</div>
      <div class="meta">${cases.filter(c=>c.status==='resolved').length} cases</div>
    </div>
  `;
}

// ── SIDEBAR ────────────────────────────────────────────────
function renderSidebar(){
  const counts = {
    all: cases.length,
    active: cases.filter(isActive).length,
    overdue: cases.filter(isOverdue).length,
    today: cases.filter(isToday).length,
    week: cases.filter(isThisWeek).length,
    resolved: cases.filter(c => c.status === 'resolved').length,
    cancelled: cases.filter(c => c.status === 'cancelled').length,
    urgent: cases.filter(c => isActive(c) && c.priority === 'urgent').length,
    high: cases.filter(c => isActive(c) && (c.priority === 'urgent' || c.priority === 'high')).length,
  };
  let html = '<div class="nav-section">View</div>';
  html += navBtn('all', '⭐', 'All Cases', counts.all);
  html += '<div class="nav-section">Active Work</div>';
  html += navBtn('active', '🟢', 'Active Pipeline', counts.active);
  html += navBtn('overdue', '🔥', 'Overdue', counts.overdue, counts.overdue>0);
  html += navBtn('today', '📅', 'Today', counts.today);
  html += navBtn('week', '📆', 'This Week', counts.week);
  html += '<div class="nav-section">By Priority</div>';
  html += navBtn('urgent', '🔴', 'Urgent', counts.urgent, counts.urgent>0);
  html += navBtn('high-up', '🟠', 'High & Up', counts.high);
  html += '<div class="nav-section">Archive</div>';
  html += navBtn('resolved', '✅', 'Resolved', counts.resolved);
  html += navBtn('cancelled', '❌', 'Cancelled', counts.cancelled);
  document.getElementById('sb-nav').innerHTML = html;
}

function navBtn(id, icon, label, count, alert){
  return `<div class="nav-btn ${activeFilter===id?'active':''} ${alert?'has-alert':''}" onclick="setFilter('${id}')">
    <span class="nb-icon">${icon}</span><span>${label}</span><span class="nb-count">${count}</span>
  </div>`;
}

function setFilter(id){
  activeFilter = id;
  if(window.innerWidth <= 900) toggleSidebar();
  renderSidebar();
  render();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

// ── SEARCH / SORT ──────────────────────────────────────────
function onSearch(){
  searchQuery = document.getElementById('search').value.trim().toLowerCase();
  render();
}
function onSort(){
  sortMode = document.getElementById('sort').value;
  render();
}

// ── RENDER CARDS ───────────────────────────────────────────
function getFiltered(){
  let list = cases.filter(c => {
    switch(activeFilter){
      case 'all': break;
      case 'active': if(!isActive(c)) return false; break;
      case 'overdue': if(!isOverdue(c)) return false; break;
      case 'today': if(!isToday(c)) return false; break;
      case 'week': if(!isThisWeek(c)) return false; break;
      case 'resolved': if(c.status !== 'resolved') return false; break;
      case 'cancelled': if(c.status !== 'cancelled') return false; break;
      case 'urgent': if(!isActive(c) || c.priority !== 'urgent') return false; break;
      case 'high-up': if(!isActive(c) || (c.priority !== 'urgent' && c.priority !== 'high')) return false; break;
    }
    if(searchQuery){
      const q = searchQuery;
      const blob = [c.title, c.customer, c.bookingRef, c.airline, c.description, (c.tags||[]).join(' ')].join(' ').toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
  // Sort
  list.sort((a,b) => {
    switch(sortMode){
      case 'created-desc': return (b.createdAt||'').localeCompare(a.createdAt||'');
      case 'created-asc': return (a.createdAt||'').localeCompare(b.createdAt||'');
      case 'followup': {
        // Overdue first, then by date ascending; null follow-ups last
        const aOver = isOverdue(a) ? 0 : 1;
        const bOver = isOverdue(b) ? 0 : 1;
        if(aOver !== bOver) return aOver - bOver;
        if(!a.followUpDate && !b.followUpDate) return 0;
        if(!a.followUpDate) return 1;
        if(!b.followUpDate) return -1;
        return a.followUpDate.localeCompare(b.followUpDate);
      }
      case 'priority': return (PRIORITIES[b.priority]?.rank||0) - (PRIORITIES[a.priority]?.rank||0);
      case 'recent': default: return (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'');
    }
  });
  return list;
}

function render(){
  const list = getFiltered();
  document.getElementById('count').innerHTML = `<strong>${list.length}</strong> ${list.length===1?'case':'cases'}${searchQuery?` matching "<strong>${escapeHtml(searchQuery)}</strong>"`:''}`;
  document.getElementById('tb-sub').textContent = `${cases.length} total cases · ${cases.filter(c=>c.status==='resolved').length} resolved`;

  const cardsEl = document.getElementById('cards');
  if(list.length === 0){
    cardsEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">${cases.length===0?'📊':'🔍'}</div>
      <h3>${cases.length===0?'No cases yet':(searchQuery?'No cases found':'No cases in this view')}</h3>
      <p>${cases.length===0
        ? 'Add your first case to start tracking. Every case logged here builds your professional record — useful for performance reviews, manager updates, and onboarding new joiners.'
        : (searchQuery ? `Nothing matches "${escapeHtml(searchQuery)}"` : 'Try another filter from the sidebar.')}</p>
      ${cases.length===0 ? '<button class="btn btn-primary" onclick="openAddModal()" style="margin-top:14px">+ Add Your First Case</button>' : ''}
    </div>`;
    return;
  }

  cardsEl.innerHTML = list.map(c => {
    const cat = CATEGORIES[c.category] || CATEGORIES.other;
    const status = STATUSES[c.status] || STATUSES.open;
    const pri = PRIORITIES[c.priority] || PRIORITIES.medium;
    const overdue = isOverdue(c);
    const today = isToday(c);
    const resolved = c.status === 'resolved';
    const cardClass = `case-card ${overdue?'is-overdue':''} ${today?'is-today':''} ${resolved?'is-resolved':''}`;
    return `<div class="${cardClass}" onclick="openDetail('${c.id}')">
      <div class="cc-row">
        <span class="cc-pill ${status.cls}">${status.icon} ${status.label}</span>
        <span class="cc-pill ${pri.cls}">${pri.icon} ${pri.label}</span>
        <span class="cc-pill cc-cat-pill">${cat.icon} ${cat.label}</span>
      </div>
      <div class="cc-title">${escapeHtml(c.title)}</div>
      <div class="cc-meta">
        ${c.customer ? `<div class="meta-row"><span class="icon">👤</span><span class="val">${escapeHtml(c.customer)}</span></div>` : ''}
        ${c.bookingRef || c.airline ? `<div class="meta-row"><span class="icon">✈️</span>${c.bookingRef?`<span class="val mono">${escapeHtml(c.bookingRef)}</span>`:''}${c.airline?` <span style="color:var(--muted)">·</span> <span>${escapeHtml(c.airline)}</span>`:''}</div>` : ''}
        <div class="meta-row"><span class="icon">⏱️</span><span>Created ${relativeTime(c.createdAt)}</span></div>
        ${c.followUpDate && !resolved ? `<div class="meta-row"><span class="icon">📅</span>Follow-up: <span class="val ${overdue?'warn':''} ${today?'today':''}">${formatFollowup(c.followUpDate)}</span></div>` : ''}
        ${resolved && c.resolvedAt ? `<div class="meta-row"><span class="icon">✅</span><span>Resolved ${relativeTime(c.resolvedAt)}</span></div>` : ''}
      </div>
      ${!resolved ? `<div class="cc-actions" onclick="event.stopPropagation()">
        <button class="cc-action-btn success" onclick="openResolveModal('${c.id}')">✓ Resolve</button>
        <button class="cc-action-btn" onclick="openEditModal('${c.id}')">✏️ Edit</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ── DETAIL MODAL ───────────────────────────────────────────
function openDetail(id){
  const c = cases.find(x => x.id === id);
  if(!c) return;
  const cat = CATEGORIES[c.category] || CATEGORIES.other;
  const status = STATUSES[c.status] || STATUSES.open;
  const pri = PRIORITIES[c.priority] || PRIORITIES.medium;

  const notesHtml = (c.notes && c.notes.length)
    ? `<div class="notes-log">${c.notes.slice().reverse().map(n => `
        <div class="note-item">
          <div class="note-meta"><span>📝</span><span class="ts">${formatDateTime(n.timestamp)}</span></div>
          <div class="note-text">${escapeHtml(n.text)}</div>
        </div>
      `).join('')}</div>`
    : `<div class="detail-text empty">No notes yet — add the first action below.</div>`;

  document.getElementById('detail-content').innerHTML = `
    <div class="m-head">
      <div class="m-titles">
        <div class="cc-row" style="margin-bottom:4px">
          <span class="cc-pill ${status.cls}">${status.icon} ${status.label}</span>
          <span class="cc-pill ${pri.cls}">${pri.icon} ${pri.label}</span>
          <span class="cc-pill cc-cat-pill">${cat.icon} ${cat.label}</span>
        </div>
        <div class="m-name">${escapeHtml(c.title)}</div>
      </div>
      <button class="m-close" onclick="closeModal('detail-modal')">✕</button>
    </div>
    <div class="m-body">
      <div class="detail-section">
        <div class="info-grid">
          <div class="info-item"><div class="il">Customer</div><div class="iv ${c.customer?'':'empty'}">${escapeHtml(c.customer || 'Not specified')}</div></div>
          <div class="info-item"><div class="il">Booking Ref</div><div class="iv mono ${c.bookingRef?'':'empty'}">${escapeHtml(c.bookingRef || '—')}</div></div>
          <div class="info-item"><div class="il">Airline</div><div class="iv ${c.airline?'':'empty'}">${escapeHtml(c.airline || '—')}</div></div>
          <div class="info-item"><div class="il">Follow-up</div><div class="iv ${c.followUpDate?'':'empty'}">${c.followUpDate ? formatFollowup(c.followUpDate) : 'No follow-up set'}</div></div>
          <div class="info-item"><div class="il">Created</div><div class="iv mono">${formatDateTime(c.createdAt)}</div></div>
          <div class="info-item"><div class="il">Last Update</div><div class="iv mono">${formatDateTime(c.updatedAt || c.createdAt)}</div></div>
        </div>
      </div>

      ${(c.description||'').trim() ? `<div class="detail-section">
        <div class="detail-label">📝 Description</div>
        <div class="detail-text">${escapeHtml(c.description)}</div>
      </div>` : ''}

      ${c.status === 'resolved' && c.resolution ? `<div class="detail-section">
        <div class="detail-label">✅ Resolution</div>
        <div class="detail-text" style="background:#f0fdf4;border-color:#86efac;color:#065f46">${escapeHtml(c.resolution)}</div>
      </div>` : ''}

      <div class="detail-section">
        <div class="detail-label">📋 Notes Log <span style="color:var(--muted);font-weight:500;margin-left:6px">(${(c.notes||[]).length})</span></div>
        ${notesHtml}
        ${c.status !== 'resolved' && c.status !== 'cancelled' ? `<div class="add-note-row">
          <textarea id="quick-note" placeholder="Add a quick note about action taken…" onkeydown="if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();addQuickNote('${c.id}')}"></textarea>
          <button class="btn btn-primary btn-sm" onclick="addQuickNote('${c.id}')">+ Add</button>
        </div>` : ''}
      </div>
    </div>
    <div class="m-foot">
      <button class="btn btn-danger btn-sm" onclick="deleteCase('${c.id}')">🗑 Delete</button>
      ${c.status !== 'resolved' && c.status !== 'cancelled' ? `<button class="btn btn-success btn-sm" onclick="closeModal('detail-modal');openResolveModal('${c.id}')">✓ Mark Resolved</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="closeModal('detail-modal');openEditModal('${c.id}')">✏️ Edit</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('detail-modal')">Close</button>
    </div>
  `;
  document.getElementById('detail-modal').classList.add('show');
}

function addQuickNote(id){
  const text = document.getElementById('quick-note').value.trim();
  if(!text){ toast('Note is empty', 'error'); return; }
  const c = cases.find(x => x.id === id);
  if(!c) return;
  if(!c.notes) c.notes = [];
  c.notes.push({ text, timestamp: NOW_ISO() });
  c.updatedAt = NOW_ISO();
  save();
  renderStats();
  render();
  openDetail(id); // refresh modal
  toast('Note added', 'success');
}

// ── ADD/EDIT FORM ──────────────────────────────────────────
function openAddModal(){
  editingId = null;
  document.getElementById('form-title').textContent = 'Add New Case';
  ['title','customer','ref','airline','description','initial-note'].forEach(f => document.getElementById('f-'+f).value = '');
  document.getElementById('f-category').value = 'other';
  document.getElementById('f-priority').value = 'medium';
  document.getElementById('f-status').value = 'open';
  document.getElementById('f-followup').value = '';
  document.getElementById('form-modal').classList.add('show');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function openEditModal(id){
  const c = cases.find(x => x.id === id);
  if(!c) return;
  editingId = id;
  document.getElementById('form-title').textContent = `Edit: ${c.title}`;
  document.getElementById('f-title').value = c.title || '';
  document.getElementById('f-customer').value = c.customer || '';
  document.getElementById('f-ref').value = c.bookingRef || '';
  document.getElementById('f-airline').value = c.airline || '';
  document.getElementById('f-category').value = c.category || 'other';
  document.getElementById('f-priority').value = c.priority || 'medium';
  document.getElementById('f-status').value = c.status || 'open';
  document.getElementById('f-followup').value = c.followUpDate || '';
  document.getElementById('f-description').value = c.description || '';
  document.getElementById('f-initial-note').value = '';
  document.getElementById('form-modal').classList.add('show');
}

function saveCase(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ toast('Title is required', 'error'); return; }

  const followUpDate = document.getElementById('f-followup').value || null;
  const initialNote = document.getElementById('f-initial-note').value.trim();
  const status = document.getElementById('f-status').value;
  const now = NOW_ISO();

  if(editingId){
    const idx = cases.findIndex(c => c.id === editingId);
    if(idx >= 0){
      const existing = cases[idx];
      const newNotes = existing.notes ? [...existing.notes] : [];
      if(initialNote){
        newNotes.push({ text: initialNote, timestamp: now });
      }
      // Auto-resolve detection
      let resolvedAt = existing.resolvedAt;
      if(status === 'resolved' && !resolvedAt) resolvedAt = now;
      if(status !== 'resolved') resolvedAt = null;
      cases[idx] = {
        ...existing,
        title,
        customer: document.getElementById('f-customer').value.trim(),
        bookingRef: document.getElementById('f-ref').value.trim(),
        airline: document.getElementById('f-airline').value.trim(),
        category: document.getElementById('f-category').value,
        priority: document.getElementById('f-priority').value,
        status,
        followUpDate,
        description: document.getElementById('f-description').value.trim(),
        notes: newNotes,
        resolvedAt,
        updatedAt: now,
      };
      toast(`Updated: ${title}`, 'success');
    }
  } else {
    const newCase = {
      id: 'case-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      title,
      customer: document.getElementById('f-customer').value.trim(),
      bookingRef: document.getElementById('f-ref').value.trim(),
      airline: document.getElementById('f-airline').value.trim(),
      category: document.getElementById('f-category').value,
      priority: document.getElementById('f-priority').value,
      status,
      followUpDate,
      description: document.getElementById('f-description').value.trim(),
      notes: initialNote ? [{ text: initialNote, timestamp: now }] : [],
      resolution: '',
      resolvedAt: status === 'resolved' ? now : null,
      createdAt: now,
      updatedAt: now,
      tags: [],
    };
    cases.unshift(newCase);
    toast(`Case logged: ${title}`, 'success');
  }
  save();
  closeModal('form-modal');
  renderSidebar();
  renderStats();
  renderHotBanner();
  render();
}

// ── RESOLVE MODAL ──────────────────────────────────────────
function openResolveModal(id){
  resolvingId = id;
  document.getElementById('f-resolution').value = '';
  document.getElementById('resolve-modal').classList.add('show');
  setTimeout(() => document.getElementById('f-resolution').focus(), 100);
}

function confirmResolve(){
  if(!resolvingId) return;
  const idx = cases.findIndex(c => c.id === resolvingId);
  if(idx < 0) return;
  const resolution = document.getElementById('f-resolution').value.trim();
  const now = NOW_ISO();
  cases[idx].status = 'resolved';
  cases[idx].resolvedAt = now;
  cases[idx].resolution = resolution;
  cases[idx].updatedAt = now;
  if(resolution){
    if(!cases[idx].notes) cases[idx].notes = [];
    cases[idx].notes.push({ text: '✅ Resolved: ' + resolution, timestamp: now });
  }
  save();
  closeModal('resolve-modal');
  resolvingId = null;
  renderSidebar();
  renderStats();
  renderHotBanner();
  render();
  toast(`Marked as resolved`, 'success');
}

function deleteCase(id){
  const c = cases.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`Delete case "${c.title}"?\n\nThis cannot be undone (but you can re-import from a backup).`)) return;
  cases = cases.filter(x => x.id !== id);
  save();
  closeModal('detail-modal');
  renderSidebar();
  renderStats();
  renderHotBanner();
  render();
  toast(`Deleted: ${c.title}`, 'success');
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

// ── EXPORT JSON ────────────────────────────────────────────
function exportData(){
  if(cases.length === 0){ toast('No cases to export yet', 'error'); return; }
  const blob = new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Adel_cases_backup_${TODAY_STR().replace(/-/g,'')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${cases.length} cases (JSON)`, 'success');
}

// ── EXPORT CSV ─────────────────────────────────────────────
function exportCSV(){
  if(cases.length === 0){ toast('No cases to export yet', 'error'); return; }
  const headers = ['ID','Created','Updated','Resolved','Status','Priority','Category','Customer','Booking Ref','Airline','Title','Description','Follow-up Date','Resolution','Notes Count','Time to Resolve (hours)'];
  const rows = cases.map(c => {
    let timeToResolve = '';
    if(c.resolvedAt && c.createdAt){
      const ms = new Date(c.resolvedAt) - new Date(c.createdAt);
      timeToResolve = (ms / (1000*60*60)).toFixed(2);
    }
    return [
      c.id,
      c.createdAt || '',
      c.updatedAt || '',
      c.resolvedAt || '',
      STATUSES[c.status]?.label || c.status || '',
      PRIORITIES[c.priority]?.label || c.priority || '',
      CATEGORIES[c.category]?.label || c.category || '',
      c.customer || '',
      c.bookingRef || '',
      c.airline || '',
      c.title || '',
      c.description || '',
      c.followUpDate || '',
      c.resolution || '',
      (c.notes || []).length,
      timeToResolve,
    ];
  });
  const escape = s => `"${String(s).replace(/"/g,'""').replace(/\n/g,' ')}"`;
  const csv = [headers.map(escape).join(','), ...rows.map(r => r.map(escape).join(','))].join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'}); // BOM for Excel
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Adel_cases_${TODAY_STR().replace(/-/g,'')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${cases.length} cases (CSV)`, 'success');
}

// ── IMPORT ─────────────────────────────────────────────────
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('Invalid format');
      const choice = confirm(`Import ${imported.length} cases.\n\nOK = Replace all current data\nCancel = Merge (add new, skip duplicates by ID)`);
      if(choice){
        cases = imported;
        toast(`Imported ${imported.length} cases (replaced)`, 'success');
      } else {
        const existingIds = new Set(cases.map(c => c.id));
        const toAdd = imported.filter(c => !existingIds.has(c.id));
        cases = [...cases, ...toAdd];
        toast(`Merged ${toAdd.length} new cases`, 'success');
      }
      save();
      renderSidebar();
      renderStats();
      renderHotBanner();
      render();
    } catch(err){
      toast('Import failed: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── DATE HELPERS ───────────────────────────────────────────
function relativeTime(iso){
  if(!iso) return '—';
  const then = new Date(iso);
  const now = new Date();
  const diffMs = now - then;
  const mins = Math.round(diffMs / 60000);
  const hours = Math.round(diffMs / 3600000);
  const days = Math.round(diffMs / 86400000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  if(hours < 24) return `${hours}h ago`;
  if(days === 1) return 'yesterday';
  if(days < 7) return `${days}d ago`;
  if(days < 30) return `${Math.round(days/7)}w ago`;
  return then.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

function formatFollowup(dateStr){
  if(!dateStr) return '—';
  const today = TODAY_STR();
  const date = new Date(dateStr);
  const todayDate = new Date(today);
  const diffDays = Math.round((date - todayDate) / 86400000);
  const formatted = date.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'});
  if(diffDays === 0) return `Today (${formatted})`;
  if(diffDays === 1) return `Tomorrow (${formatted})`;
  if(diffDays === -1) return `Yesterday — overdue`;
  if(diffDays < 0) return `${Math.abs(diffDays)}d overdue`;
  if(diffDays < 7) return `In ${diffDays}d (${formatted})`;
  return formatted;
}

function formatDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── HELPERS ────────────────────────────────────────────────
function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Refresh stats every minute (so "X minutes ago" stays current)
setInterval(() => { if(document.visibilityState === 'visible') { renderStats(); render(); } }, 60000);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeModal('detail-modal');
    closeModal('form-modal');
    closeModal('resolve-modal');
  }
  // Ctrl/Cmd + N = new case
  if((e.ctrlKey || e.metaKey) && e.key === 'n'){
    e.preventDefault();
    openAddModal();
  }
});

init();
</script>
