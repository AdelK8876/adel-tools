<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travelport Galileo — Quick Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sb:235px;--navy:#0a1628;--blue:#0057b8;--teal:#00a3a3;--sky:#38b6e8;
  --amber:#f59e0b;--bg:#f0f4f8;--card:#fff;--border:#dde3ea;
  --cmd:#0d1f3c;--cmd-t:#b8d4f8;--text:#1a2535;--muted:#6b7a92;
  --green:#059669;--red:#dc2626;--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* ── SIDEBAR ── */
#sb{position:fixed;top:0;left:0;width:var(--sb);height:100vh;background:var(--navy);display:flex;flex-direction:column;overflow:hidden;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,.3)}
#sb-logo{background:linear-gradient(135deg,var(--blue),var(--teal));padding:16px;flex-shrink:0}
#sb-logo .brand{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
#sb-logo .brand .dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.7}
#sb-logo .sub{color:rgba(255,255,255,.7);font-size:10px;margin-top:3px;letter-spacing:.8px;text-transform:uppercase}
#sb-search{padding:10px 12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
#sb-search input{width:100%;padding:7px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:12px;outline:none;font-family:'Inter',sans-serif}
#sb-search input::placeholder{color:rgba(255,255,255,.38)}
#sb-search input:focus{border-color:var(--sky)}
#sb-nav{flex:1;overflow-y:auto;padding:6px 0}
#sb-nav::-webkit-scrollbar{width:3px}
#sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.nav-grp{padding:10px 14px 3px;font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em}
.nav-item{display:flex;align-items:center;padding:7px 14px;color:rgba(255,255,255,.68);font-size:12.5px;cursor:pointer;border-left:3px solid transparent;gap:8px;transition:all .15s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:rgba(56,182,232,.15);color:#fff;border-left-color:var(--sky)}
.nav-item .ic{width:18px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item .nc{margin-left:auto;font-size:10px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:10px;color:rgba(255,255,255,.45)}
#sb-foot{padding:10px 14px;font-size:9.5px;color:rgba(255,255,255,.28);border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;line-height:1.7}
#sb-foot a{color:var(--sky);text-decoration:none;opacity:.8}
#sb-foot a:hover{opacity:1}

/* ── MAIN ── */
#main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.tp-badge{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;letter-spacing:.5px;white-space:nowrap}
#main-search{flex:1;padding:8px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;outline:none;transition:border-color .15s;background:var(--bg);font-family:'Inter',sans-serif}
#main-search:focus{border-color:var(--blue)}
#res-count{font-size:12px;color:var(--muted);white-space:nowrap;min-width:90px;text-align:right}
#agent-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
#agent-wrap label{font-size:11px;color:var(--muted);white-space:nowrap}
#agent-sign{width:60px;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-weight:700;text-align:center;text-transform:uppercase;outline:none;font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--cmd)}
#agent-sign:focus{border-color:var(--blue)}

/* ── CONTENT ── */
#content{padding:20px 24px;flex:1}
.section{margin-bottom:28px;scroll-margin-top:62px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-title{font-size:14.5px;font-weight:700}
.sec-badge{font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--muted);margin-left:auto}

/* ── TABLE ── */
.ctable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;table-layout:fixed}
.ctable colgroup .c1{width:37%}.ctable colgroup .c2{width:47%}.ctable colgroup .c3{width:16%}
.ctable tr.hrow td{background:#eef2f7;font-size:10.5px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:.07em;padding:7px 14px;border-top:1px solid var(--border)}
.ctable tr.hrow td:first-child{border-left:4px solid var(--teal)}
.ctable tr.crow td{padding:7px 10px;vertical-align:middle;border-bottom:1px solid #eef0f4}
.ctable tr.crow:last-child td{border-bottom:none}
.ctable tr.crow:nth-child(even) td{background:#f8fafc}
.ctable tr.crow:hover td{background:#eef4ff}
.ctable tr.crow.hide{display:none}
.cmd-box{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--cmd);color:var(--cmd-t);padding:4px 9px;border-radius:5px;display:inline-block;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s;vertical-align:middle}
.cmd-box:hover{background:#1a3a6e}
.cmd-box.ok{background:#054a2e;color:#6ee7b7}
.desc{font-size:12.5px;color:var(--text);line-height:1.45}
.btn-wrap{display:flex;flex-direction:column;gap:4px}
.cpbtn{font-size:10px;border:1px solid var(--border);background:var(--card);padding:3px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;transition:all .12s;width:100%;color:var(--muted);font-family:'Inter',sans-serif}
.cpbtn:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.fillbtn{font-size:10px;border:1px solid var(--sky);background:#e0f4fd;padding:3px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;transition:all .12s;width:100%;color:var(--blue);font-weight:600;font-family:'Inter',sans-serif}
.fillbtn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── NOTE BOX ── */
.note{background:#fffbe6;border:1px solid #f0c040;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#7a5c00;margin-bottom:12px}
.info{background:#e0f4fd;border:1px solid #90cef4;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#0057b8;margin-bottom:12px}

/* ── TOOLS ── */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.tool-hdr{font-size:13px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--teal);display:flex;align-items:center;gap:6px}
.tlabel{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.trow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-end}
.tinput{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s;text-transform:uppercase;background:#fff}
.tinput:focus{border-color:var(--blue)}
.tinput.sm{width:76px}.tinput.md{width:100px}.tinput.lg{flex:1;min-width:80px}
.tbtn{padding:8px 16px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap;font-family:'Inter',sans-serif;letter-spacing:.03em}
.tbtn:hover{opacity:.88}
.tout{background:#f0f4f8;border:1.5px dashed #b0bec8;border-radius:6px;padding:8px 12px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--cmd);min-height:34px;margin-top:4px;word-break:break-all;cursor:pointer}
.tout.ok{border-color:var(--green);background:#f0fdf8;color:var(--green)}
.tout.err{border-color:var(--red);background:#fff5f5;color:var(--red)}

/* ── MODAL ── */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
#mo.show{display:flex}
#mb{background:#fff;border-radius:14px;width:510px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.28)}
#mhead{background:linear-gradient(135deg,var(--navy),#0a3069);padding:18px 22px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
#mhead h2{color:#fff;font-size:15px;font-weight:700;margin:0}
#mhead .msub{color:rgba(255,255,255,.58);font-size:10.5px;margin-top:3px;font-family:'JetBrains Mono',monospace}
#mcls{background:rgba(255,255,255,.12);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;transition:background .15s;line-height:1}
#mcls:hover{background:rgba(255,255,255,.25)}
#mbody{padding:20px 22px}
#mnote{background:#e0f4fd;border:1px solid #90cef4;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#0057b8;margin-bottom:16px;font-family:'JetBrains Mono',monospace;line-height:1.6;word-break:break-all}
.mf{margin-bottom:13px}
.mf label{display:block;font-size:11.5px;font-weight:600;color:#444;margin-bottom:5px}
.mf input,.mf select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s;background:#fff}
.mf select{text-transform:none;font-family:'Inter',sans-serif}
.mf input:focus,.mf select:focus{border-color:var(--blue)}
.mf .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
#mres{background:#0d1f3c;border-radius:8px;padding:14px 16px;margin:16px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;color:#b8d4f8;min-height:48px;word-break:break-all;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .2s}
#mres .rl{font-size:9.5px;color:rgba(255,255,255,.35);flex-shrink:0;text-transform:uppercase;letter-spacing:.08em}
#mres-txt{flex:1}
#mfooter{display:flex;gap:10px;padding:0 22px 20px}
#gbtn{flex:1;padding:11px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border:none;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:'Inter',sans-serif;letter-spacing:.04em}
#gbtn:hover{opacity:.9}
#cbtn2{padding:11px 20px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;color:var(--text);font-family:'Inter',sans-serif}
#cbtn2:hover{background:#e4e9f0}
@media print{#sb,#topbar{display:none}#main{margin-left:0}.cpbtn,.fillbtn{display:none}}
</style>
</head>
<body>

<aside id="sb">
  <div id="sb-logo">
    <div class="brand"><div class="dot"></div>TRAVELPORT</div>
    <div class="sub">Galileo Quick Reference</div>
  </div>
  <div id="sb-search"><input id="sbq" placeholder="Jump to section..." oninput="filterNav(this.value)"></div>
  <nav id="sb-nav"></nav>
  <div id="sb-foot">
    ✏️ Fill = generate with your data<br>
    Click any command to copy it<br><br>
    <a href="https://travelportprod.service-now.com/mytravelport_support" target="_blank">🔗 Travelport Support</a>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <span class="tp-badge">✈ GALILEO</span>
    <input id="main-search" placeholder="Search all commands and descriptions..." oninput="doSearch(this.value)" autocomplete="off">
    <div id="agent-wrap">
      <label>Agent:</label>
      <input id="agent-sign" value="P" maxlength="6" title="Your agent initial — used in cancel/save commands">
    </div>
    <span id="res-count"></span>
  </div>
  <div id="content"></div>
</div>

<!-- MODAL -->
<div id="mo" onclick="if(event.target===this)closeMo()">
  <div id="mb">
    <div id="mhead">
      <div><h2 id="mtitle"></h2><div class="msub" id="msub"></div></div>
      <button id="mcls" onclick="closeMo()">✕</button>
    </div>
    <div id="mbody">
      <div id="mnote"></div>
      <div id="mfields"></div>
      <div id="mres" onclick="cpResult()"><span class="rl">Result:</span><span id="mres-txt">Fill in the fields and click Generate</span></div>
    </div>
    <div id="mfooter">
      <button id="gbtn" onclick="genCopy()">⚡ Generate &amp; Copy</button>
      <button id="cbtn2" onclick="closeMo()">Close</button>
    </div>
  </div>
</div>

<script>
// ── FORM DEFINITIONS ──────────────────────────────────────────────
const FD = {
  'adult-name':{
    t:'Adult Name Entry', s:'N.LASTNAME/FIRSTNAME TITLE',
    n:'N.KADDOUR/ADEL MR   →   Travelport adult name format',
    f:[{id:'first',l:'First Name',p:'ADEL',u:1,r:1},
       {id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'title',l:'Title',sel:['MR','MRS','MS','DR','PROF','REV','CAPT','SIR']}],
    b(v){return `N.${v.last}/${v.first} ${v.title}`}
  },
  'child-name':{
    t:'Child Name Entry', s:'N.LASTNAME/FIRSTNAME TITLE*P-C{age}',
    n:'N.KADDOUR/ADAM MSTR*P-C8   (age is auto-calculated from DOB)',
    f:[{id:'first',l:'First Name',p:'ADAM',u:1,r:1},
       {id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'title',l:'Gender',sel:['MSTR  (Male)','MISS  (Female)']},
       {id:'dob',l:'Date of Birth',type:'date',r:1,u:0,h:'Age is automatically calculated'}],
    b(v){
      const age=calcAge(v.dob);
      return `N.${v.last}/${v.first} ${v.title.split(' ')[0]}*P-C${age}`;
    }
  },
  'infant-name':{
    t:'Infant Name Entry', s:'N.I/LASTNAME/FIRSTNAMETITLE*DDMMMYY',
    n:'N.I/KADDOUR/ADAMMSTR*15MAR23   (DOB in DDMMMYY format)',
    f:[{id:'first',l:'First Name',p:'ADAM',u:1,r:1},
       {id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'title',l:'Gender',sel:['MSTR  (Male)','MISS  (Female)']},
       {id:'dob',l:'Date of Birth',type:'date',r:1,u:0,h:'Format will be auto-converted to DDMMMYY'}],
    b(v){
      const fd=fmtDate(v.dob,true);
      return `N.I/${v.last}/${v.first}${v.title.split(' ')[0]}*${fd}`;
    }
  },
  'retrieve-pnr':{
    t:'Retrieve PNR', s:'*{RecordLocator}   or   *-{Name}',
    n:'*N36JDF   or   *-KADDOUR   or   *25APR-KADDOUR',
    f:[{id:'type',l:'Retrieve By',sel:['Record Locator','Family Name','Family Name + Date']},
       {id:'locator',l:'Record Locator',p:'N36JDF',u:1,h:'Leave blank if retrieving by name'},
       {id:'name',l:'Family Name',p:'KADDOUR',u:1,h:'Leave blank if retrieving by locator'},
       {id:'date',l:'Departure Date (for name+date only)',type:'date',u:0}],
    b(v){
      const t=v.type;
      if(t.startsWith('Record'))return `*${v.locator}`;
      if(t.startsWith('Family Name +')&&v.date)return `*${fmtDate(v.date,false)}-${v.name}`;
      return `*-${v.name}`;
    }
  },
  'availability':{
    t:'Flight Availability', s:'A{date}{DEP}{DEST}[.D][/{airline}][+return]',
    n:'A25APRCAIBEY/MS   or   A25APRCAIBEY.D/MS+BEYCAI25MAY/ME',
    f:[{id:'dep',l:'Departure Airport (3 letters)',p:'CAI',u:1,r:1},
       {id:'arr',l:'Arrival Airport (3 letters)',p:'BEY',u:1,r:1},
       {id:'date',l:'Departure Date',type:'date',r:1,u:0},
       {id:'airline',l:'Airline Code (2 letters)',p:'MS',u:1,h:'e.g. MS  EK  ME  LH  QR'},
       {id:'direct',l:'Direct Flights Only?',sel:['No (show all)','Yes (.D)']},
       {id:'rt',l:'Return Type',sel:['One Way only','Round Trip — Return date','Round Trip — Return after days','Round Trip — same window (both segments)']},
       {id:'ret_date',l:'Return Date (if round trip by date)',type:'date',u:0},
       {id:'ret_days',l:'Return after how many days',p:'25',h:'e.g. 25 — used when return type is "days"'},
       {id:'ret_orig',l:'Return Origin (if both segments)',p:'BEY',u:1,h:'Usually same as arrival above'},
       {id:'ret_dest',l:'Return Destination (if both segments)',p:'CAI',u:1,h:'Usually same as departure above'},
       {id:'ret_air',l:'Return Airline (if both segments)',p:'MS',u:1}],
    b(v){
      const d=fmtDate(v.date,false);
      const direct=v.direct.startsWith('Yes')?'.D':'';
      const al=v.airline?`/${v.airline}`:'';
      const base=`A${d}${v.dep}${v.arr}${direct}${al}`;
      if(v.rt.includes('Return date')&&v.ret_date){
        const rd=fmtDate(v.ret_date,false);
        return `${base}+${v.ret_orig||v.arr}${v.ret_dest||v.dep}${rd}/${v.ret_air||v.airline}`;
      }
      if(v.rt.includes('days')&&v.ret_days){
        return `${base}+${v.ret_days}/${v.ret_air||v.airline}`;
      }
      if(v.rt.includes('same window')&&v.ret_date){
        const rd=fmtDate(v.ret_date,false);
        return `${base}+${v.ret_orig||v.arr}${v.ret_dest||v.dep}${rd}/${v.ret_air||v.airline}`;
      }
      return base;
    }
  },
  'connection':{
    t:'Connection / Via (Same Airline)', s:'A{date}{DEP}{DEST}*{airline}',
    n:'A25APRCAIKUL*EY   →   CAI-AUH-KUL pure Etihad connection',
    f:[{id:'dep',l:'Origin Airport (3 letters)',p:'CAI',u:1,r:1},
       {id:'dest',l:'Final Destination (3 letters)',p:'KUL',u:1,r:1},
       {id:'date',l:'Departure Date',type:'date',r:1,u:0},
       {id:'airline',l:'Airline Code (2 letters)',p:'EY',u:1,r:1,h:'All connections must be on this airline'},
       {id:'direct',l:'Direct Only?',sel:['No','Yes (.D)']}],
    b(v){
      const d=fmtDate(v.date,false);
      const dr=v.direct.startsWith('Yes')?'.D':'';
      return `A${d}${v.dep}${v.dest}${dr}*${v.airline}`;
    }
  },
  'sell':{
    t:'Sell / Book a Seat', s:'N{line}{class}.{qty}',
    n:'N1Y.1   or   N2B.2   (line from availability, class, quantity)',
    f:[{id:'line',l:'Availability Line Number',p:'1',r:1},
       {id:'cls',l:'Class of Service',p:'Y',u:1,r:1,h:'Single letter: Y W C F M B K H etc.'},
       {id:'qty',l:'Number of Seats',p:'1',r:1}],
    b(v){return `N${v.line}${v.cls}.${v.qty}`}
  },
  'phone':{
    t:'Phone Number Entry', s:'P.M*{number}',
    n:'P.M*00201234567890   (Travelport standard phone field)',
    f:[{id:'phone',l:'Phone Number (with country code)',p:'00201234567890',r:1,h:'Include country code — e.g. 0020 for Egypt, 0044 for UK'}],
    b(v){return `P.M*${v.phone}`}
  },
  'ctcm':{
    t:'SSR CTCM — Mobile Phone', s:'SI.P{pax}/SSRCTCMYYHK1/{number}',
    n:'SI.P1/SSRCTCMYYHK1/00201234567890',
    f:[{id:'pax',l:'Passenger Number',p:'1',r:1},
       {id:'phone',l:'Mobile Number (with country code)',p:'00201234567890',r:1}],
    b(v){return `SI.P${v.pax}/SSRCTCMYYHK1/${v.phone}`}
  },
  'email':{
    t:'Email Address — MT Field', s:'MT.{email}',
    n:'MT.adel.kaddour@gmail.com',
    f:[{id:'email',l:'Email Address',p:'name@domain.com',r:1,u:0}],
    b(v){return `MT.${v.email}`}
  },
  'ctce':{
    t:'SSR CTCE — Email Address', s:'SI.P{pax}/SSRCTCEYYHK1/{user//{domain}}',
    n:'SI.P1/SSRCTCEYYHK1/ADEL.KADDOUR//GMAIL.COM   (@ becomes //)',
    f:[{id:'pax',l:'Passenger Number',p:'1',r:1},
       {id:'email',l:'Email Address',p:'name@domain.com',r:1,u:0,h:'The @ sign will be auto-converted to //'}],
    b(v){return `SI.P${v.pax}/SSRCTCEYYHK1/${v.email.replace('@','//')}`}
  },
  'docs':{

// ── HELPERS ───────────────────────────────────────────────────────
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtDate(s,yr){
  if(!s)return '';
  const d=new Date(s);
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=MONTHS[d.getMonth()];
  const yy=String(d.getFullYear()).slice(-2);
  return yr?`${dd}${mm}${yy}`:`${dd}${mm}`;
}
function calcAge(s){
  if(!s)return 0;
  const t=new Date(),b=new Date(s);
  let a=t.getFullYear()-b.getFullYear();
  if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;
  return a;
}
function getSign(){return (document.getElementById('agent-sign')?.value||'P').trim().toUpperCase();}

let allRows=[],curForm=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function cpText(t,el){
  navigator.clipboard.writeText(t).then(()=>{
    if(!el)return;const o=el.textContent;
    el.textContent='✓ Copied';el.classList.add('ok');
    setTimeout(()=>{el.textContent=o;el.classList.remove('ok')},1400);
  });
}
function cpResult(){
  const t=document.getElementById('mres-txt').textContent;
  if(t&&t!=='Fill in the fields and click Generate')navigator.clipboard.writeText(t);
}

function buildSections(){
  const c=document.getElementById('content');let html='';
  html+=`<div class="info">💡 <strong>Agent Sign:</strong> Set your agent initial in the top bar. It will be used automatically in save commands like Cancel Itinerary (XI). &nbsp;|&nbsp; <strong>Support:</strong> <a href="https://travelportprod.service-now.com/mytravelport_support" target="_blank" style="color:var(--blue)">Travelport Support Portal</a></div>`;

  SECTIONS.forEach(s=>{
    html+=`<div class="section" id="${s.id}">`;
    const cnt=s.cmds.filter(r=>!r[2]).length;
    html+=`<div class="sec-hdr"><span class="sec-dot" style="background:${s.color}"></span><span class="sec-title">${s.icon} ${s.title}</span><span class="sec-badge">${cnt} entries</span></div>`;
    html+=`<table class="ctable"><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><tbody>`;
    s.cmds.forEach((r,i)=>{
      if(r[2]){html+=`<tr class="hrow"><td colspan="3">${r[0]}</td></tr>`;return;}
      const rid=`r-${s.id}-${i}`,hf=!!CF[r[0]];
      const isDynamic=r[0].includes('{');
      html+=`<tr class="crow" id="${rid}" data-cmd="${esc(r[0])}" data-desc="${esc(r[1])}">`;
      html+=`<td><span class="cmd-box" onclick="cpText(this.textContent.trim(),this)" title="Click to copy">${esc(r[0])}</span></td>`;
      html+=`<td><span class="desc">${esc(r[1])}</span></td>`;
      html+=`<td><div class="btn-wrap">`;
      if(hf)html+=`<button class="fillbtn" onclick="openForm('${esc(r[0])}')">✏️ Fill</button>`;
      if(!isDynamic)html+=`<button class="cpbtn" onclick="cpText('${esc(r[0])}',document.querySelector('#${rid} .cmd-box'))">Copy</button>`;
      html+=`</div></td></tr>`;
      allRows.push({id:rid,cmd:r[0].toLowerCase(),desc:r[1].toLowerCase()});
    });
    html+=`</tbody></table></div>`;
  });

  // INTERACTIVE TOOLS
  html+=buildToolsSection();
  c.innerHTML=html;
}

</div>
</div>

<div class="tool-card">
  <div class="tool-hdr">📋 Cancel Itinerary Builder</div>

</div>

  <div class="trow"><input id="d-date" class="tinput lg" type="date" style="text-transform:none"><button class="tbtn" onclick="formatDt()">Format</button></div>
  <div class="tlabel" style="margin-top:6px">DDMMM (no year)</div><div id="d-short" class="tout" onclick="cpText(this.textContent,this)"></div>
  <div class="tlabel" style="margin-top:6px">DDMMMYY (with year)</div><div id="d-long" class="tout" onclick="cpText(this.textContent,this)"></div>
</div>

</div>`;}

// ── TOOL FUNCTIONS ────────────────────────────────────────────────
const TZ={'CAI':'Africa/Cairo','HRG':'Africa/Cairo','SSH':'Africa/Cairo','LXR':'Africa/Cairo','DXB':'Asia/Dubai','AUH':'Asia/Dubai','SHJ':'Asia/Dubai','KWI':'Asia/Kuwait','BAH':'Asia/Bahrain','DOH':'Asia/Qatar','MCT':'Asia/Muscat','RUH':'Asia/Riyadh','JED':'Asia/Riyadh','MED':'Asia/Riyadh','DMM':'Asia/Riyadh','AMM':'Asia/Amman','BEY':'Asia/Beirut','IST':'Europe/Istanbul','AYT':'Europe/Istanbul','TLV':'Asia/Jerusalem','ATH':'Europe/Athens','LHR':'Europe/London','LGW':'Europe/London','MAN':'Europe/London','CDG':'Europe/Paris','ORY':'Europe/Paris','FRA':'Europe/Berlin','MUC':'Europe/Berlin','AMS':'Europe/Amsterdam','BRU':'Europe/Brussels','ZRH':'Europe/Zurich','VIE':'Europe/Vienna','FCO':'Europe/Rome','MXP':'Europe/Rome','MAD':'Europe/Madrid','BCN':'Europe/Madrid','LIS':'Europe/Lisbon','CPH':'Europe/Copenhagen','OSL':'Europe/Oslo','ARN':'Europe/Stockholm','HEL':'Europe/Helsinki','WAW':'Europe/Warsaw','PRG':'Europe/Prague','BUD':'Europe/Budapest','SVO':'Europe/Moscow','BOM':'Asia/Kolkata','DEL':'Asia/Kolkata','BLR':'Asia/Kolkata','KHI':'Asia/Karachi','ISB':'Asia/Karachi','DAC':'Asia/Dhaka','CMB':'Asia/Colombo','BKK':'Asia/Bangkok','KUL':'Asia/Kuala_Lumpur','SIN':'Asia/Singapore','CGK':'Asia/Jakarta','MNL':'Asia/Manila','HKG':'Asia/Hong_Kong','PEK':'Asia/Shanghai','PVG':'Asia/Shanghai','ICN':'Asia/Seoul','NRT':'Asia/Tokyo','HND':'Asia/Tokyo','KIX':'Asia/Tokyo','TPE':'Asia/Taipei','JFK':'America/New_York','LGA':'America/New_York','MIA':'America/New_York','BOS':'America/New_York','ATL':'America/New_York','ORD':'America/Chicago','DFW':'America/Chicago','DEN':'America/Denver','LAX':'America/Los_Angeles','SFO':'America/Los_Angeles','SEA':'America/Los_Angeles','YYZ':'America/Toronto','MEX':'America/Mexico_City','GRU':'America/Sao_Paulo','EZE':'America/Argentina/Buenos_Aires','JNB':'Africa/Johannesburg','NBO':'Africa/Nairobi','ADD':'Africa/Addis_Ababa','LOS':'Africa/Lagos','CMN':'Africa/Casablanca','TUN':'Africa/Tunis','SYD':'Australia/Sydney','MEL':'Australia/Melbourne','AKL':'Pacific/Auckland'};

function getTime(){
  const city=(document.getElementById('t-city').value||'').toUpperCase().trim();
  const ce=document.getElementById('t-cmd'),re=document.getElementById('t-res');
  if(!city||city.length!==3){re.textContent='Enter a 3-letter city code';re.className='tout err';return;}
  ce.textContent=`@LT ${city}`;ce.className='tout';
  const tz=TZ[city];
  if(tz){
    re.textContent=`${city} → ${new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}`;
    re.className='tout ok';
  } else {re.textContent=`${city} not in local DB. Use @LT ${city} in Travelport terminal.`;re.className='tout';}
}

let rC={};
function getCurrency(){
  const from=(document.getElementById('c-from').value||'USD').toUpperCase();
  const amt=parseFloat(document.getElementById('c-amt').value)||100;
  const to=(document.getElementById('c-to').value||'EGP').toUpperCase();
  const ce=document.getElementById('c-cmd'),re=document.getElementById('c-res');
  ce.textContent=`FZS${from}${amt}${to}`;ce.className='tout';
  re.textContent='Fetching...';re.className='tout';
  if(rC[from]){applyR(rC[from],from,to,amt,re);return;}
  fetch(`https://open.er-api.com/v6/latest/${from}`).then(r=>r.json()).then(d=>{
    if(d.result==='success'){rC[from]=d.rates;applyR(d.rates,from,to,amt,re);}else throw 0;
  }).catch(()=>{re.textContent='Live rates unavailable. Use the Travelport command above.';re.className='tout';});
}
function applyR(rates,from,to,amt,el){
  if(rates[to]){el.textContent=`${amt} ${from} = ${(amt*rates[to]).toFixed(4)} ${to}  (1 ${from} = ${rates[to].toFixed(6)} ${to})`;el.className='tout ok';}
  else{el.textContent=`Currency ${to} not found.`;el.className='tout';}
}

function buildXI(){
  const sign=getSign();
  const code=`XI^R.${sign}^ER`;
  document.getElementById('xi-res').textContent=code;
  document.getElementById('xi-res').className='tout ok';
  navigator.clipboard.writeText(code);
}

function formatDt(){
  const val=document.getElementById('d-date').value;
  if(!val){return;}
  const short=fmtDate(val,false),long=fmtDate(val,true);
  document.getElementById('d-short').textContent=short;document.getElementById('d-short').className='tout ok';
  document.getElementById('d-long').textContent=long;document.getElementById('d-long').className='tout ok';
}

// ── MODAL ─────────────────────────────────────────────────────────
function openForm(cmdKey){
  const fid=CF[cmdKey];if(!fid)return;
  const def=FD[fid];if(!def)return;curForm=def;
  document.getElementById('mtitle').textContent=def.t;
  document.getElementById('msub').textContent=def.s||'';
  document.getElementById('mnote').textContent=def.n||'';
  const mf=document.getElementById('mfields');
  mf.innerHTML=def.f.map(f=>{
    const u=(f.u!==false&&f.type!=='date')?'style="text-transform:uppercase"':'';
    if(f.sel){
      const opts=f.sel.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      return `<div class="mf"><label>${f.l}${f.r?'<span style="color:#dc2626"> *</span>':''}</label><select id="mf-${f.id}">${opts}</select>${f.h?`<div class="hint">${f.h}</div>`:''}</div>`;
    }
    const tp=f.type||'text';
    return `<div class="mf"><label>${f.l}${f.r?'<span style="color:#dc2626"> *</span>':''}</label><input id="mf-${f.id}" type="${tp}" placeholder="${f.p||''}" ${f.max?`maxlength="${f.max}"`:''} ${u} autocomplete="off">${f.h?`<div class="hint">${f.h}</div>`:''}</div>`;
  }).join('');
  document.getElementById('mres-txt').textContent='Fill in the fields and click Generate';
  document.getElementById('mres').style.background='#0d1f3c';
  document.getElementById('mres').style.color='#b8d4f8';
  document.getElementById('gbtn').textContent='⚡ Generate & Copy';
  document.getElementById('mo').classList.add('show');
  setTimeout(()=>{mf.querySelector('input,select')?.focus();},100);
}

function genCopy(){
  if(!curForm)return;
  const vals={};let ok=true;
  curForm.f.forEach(f=>{
    const el=document.getElementById('mf-'+f.id);if(!el)return;
    let v=el.value.trim();
    if(f.u!==false&&f.type!=='date')v=v.toUpperCase();
    if(f.r&&!v){el.style.borderColor='#dc2626';ok=false;}else el.style.borderColor='';
    vals[f.id]=v;
  });
  if(!ok){
    document.getElementById('mres-txt').textContent='⚠️ Please fill in all required fields (marked *)';
    document.getElementById('mres').style.background='#3d0a0a';
    document.getElementById('mres').style.color='#f87171';return;
  }
  const result=curForm.b(vals);
  document.getElementById('mres-txt').textContent=result;
  navigator.clipboard.writeText(result).then(()=>{
    document.getElementById('mres').style.background='#054a2e';
    document.getElementById('mres').style.color='#6ee7b7';
    const btn=document.getElementById('gbtn');
    btn.textContent='✅ Copied to Clipboard!';
    setTimeout(()=>{btn.textContent='⚡ Generate & Copy';},2000);
  }).catch(()=>{
    document.getElementById('mres').style.background='#1a3a00';
    document.getElementById('mres').style.color='#bef264';
    document.getElementById('gbtn').textContent='Click the code above to copy';
    setTimeout(()=>{document.getElementById('gbtn').textContent='⚡ Generate & Copy';},3000);
  });
}
function closeMo(){document.getElementById('mo').classList.remove('show');curForm=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMo();});

// ── NAV ───────────────────────────────────────────────────────────
function buildNav(){
  const nav=document.getElementById('sb-nav');
  const G=[
    {l:'Reservations',ids:['pnr','names','avail','contact','osi-ssr','ffn','seats']},
    {l:'Manage PNR',ids:['modify','endpnr','display','queue']},
    {l:'Fares & Tickets',ids:['fares','ticket','void-refund']},
    {l:'Reference',ids:['tools','airline-ref']},
    {l:'Interactive Tools',ids:['itools']},
  ];
  const allS=[...SECTIONS,{id:'itools',title:'Interactive Tools',icon:'⚡',cmds:[]}];
  let h='';
  G.forEach(g=>{
    h+=`<div class="nav-grp">${g.l}</div>`;
    g.ids.forEach(id=>{
      const s=allS.find(x=>x.id===id);if(!s)return;
      const cnt=(s.id==='itools')?'':s.cmds.filter(r=>!r[2]).length;
      h+=`<div class="nav-item" id="nav-${s.id}" onclick="goSec('${s.id}')"><span class="ic">${s.icon||'•'}</span>${s.title}${cnt?`<span class="nc">${cnt}</span>`:''}`;
      h+=`</div>`;
    });
  });
  nav.innerHTML=h;
}

function goSec(id){
  document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
  document.getElementById('nav-'+id)?.classList.add('on');
}
function filterNav(q){
  const v=q.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{el.style.display=(!v||el.textContent.toLowerCase().includes(v))?'':'none';});
}
function doSearch(q){
  const v=q.trim().toLowerCase();let shown=0;
  allRows.forEach(r=>{
    const el=document.getElementById(r.id);if(!el)return;
    const m=!v||r.cmd.includes(v)||r.desc.includes(v);
    el.classList.toggle('hide',!m);if(m)shown++;
  });
  document.getElementById('res-count').textContent=v?`${shown} of ${allRows.length}`:`${allRows.length} total entries`;
  SECTIONS.forEach(s=>{const el=document.getElementById(s.id);if(!el)return;el.style.display=(v&&!el.querySelectorAll('.crow:not(.hide)').length)?'none':'';});
}

// ── INIT ──────────────────────────────────────────────────────────
buildSections();buildNav();
document.getElementById('res-count').textContent=`${allRows.length} total entries`;
document.querySelectorAll('.section').forEach(s=>{
  new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
      const ni=document.getElementById('nav-'+e.target.id);
      if(ni){ni.classList.add('on');ni.scrollIntoView({block:'nearest'});}
    }});
  },{root:null,rootMargin:'-20% 0px -60% 0px',threshold:0}).observe(s);
});
setInterval(()=>{const c=(document.getElementById('t-city')?.value||'').toUpperCase();if(c.length===3&&TZ[c]&&document.getElementById('t-res')?.className.includes('ok'))getTime();},5000);
</script>
