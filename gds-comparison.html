<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDS Format Comparison Guide — Training Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --tp:#1d4ed8; --tp-bg:#eff6ff; --tp-light:#dbeafe;
  --ws:#7c3aed; --ws-bg:#f5f3ff; --ws-light:#ede9fe;
  --ap:#0891b2; --ap-bg:#ecfeff; --ap-light:#cffafe;
  --am:#dc2626; --am-bg:#fef2f2; --am-light:#fee2e2;
  --sb:#059669; --sb-bg:#f0fdf4; --sb-light:#dcfce7;
  --navy:#0f172a; --navy2:#1e293b; --slate:#334155;
  --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --light:#f1f5f9;
  --sb-w:270px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:13.5px}
code,kbd,.cmd{font-family:'JetBrains Mono',monospace}

/* ── SIDEBAR ── */
#sidebar{width:var(--sb-w);background:var(--navy);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;box-shadow:4px 0 24px rgba(0,0,0,.25)}
#sb-head{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);padding:16px 18px;flex-shrink:0}
#sb-head .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#sb-head .logo-icon{background:rgba(255,255,255,.15);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
#sb-head .logo-text{color:#fff;font-size:14px;font-weight:700;line-height:1.2}
#sb-head .logo-sub{color:rgba(255,255,255,.6);font-size:10px;margin-top:1px}
.gds-pills{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2)}
.gds-pill{padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;letter-spacing:.03em}
.gds-pill.tp{background:var(--tp-bg);color:var(--tp);border-color:var(--tp-light)}
.gds-pill.ws{background:var(--ws-bg);color:var(--ws);border-color:var(--ws-light)}
.gds-pill.ap{background:var(--ap-bg);color:var(--ap);border-color:var(--ap-light)}
.gds-pill.am{background:var(--am-bg);color:var(--am);border-color:var(--am-light)}
.gds-pill.sb{background:var(--sb-bg);color:var(--sb);border-color:var(--sb-light)}
.gds-pill.off{opacity:.35;filter:grayscale(.8)}
#sb-search-wrap{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
#sb-search{width:100%;padding:7px 11px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#fff;font-size:12px;outline:none;font-family:'Inter',sans-serif}
#sb-search::placeholder{color:rgba(255,255,255,.35)}
#sb-search:focus{border-color:rgba(59,130,246,.6);background:rgba(255,255,255,.12)}
#sb-nav{flex:1;overflow-y:auto;padding:6px 0}
#sb-nav::-webkit-scrollbar{width:3px}
#sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.nav-group{padding:8px 14px 3px;font-size:9px;font-weight:700;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.12em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;color:rgba(255,255,255,.65);font-size:12px;font-weight:500;transition:all .14s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(59,130,246,.18);border-left-color:#3b82f6;color:#fff}
.nav-item .ni{width:20px;text-align:center;font-size:13px}
.nav-item .badge{margin-left:auto;font-size:9px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:8px;color:rgba(255,255,255,.4)}
#sb-footer{padding:10px 14px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.gds-legend{display:flex;flex-direction:column;gap:4px}
.legend-row{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.4)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── MAIN ── */
#main{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#topbar .title{font-size:14px;font-weight:700;color:var(--navy)}
#topbar .sub{font-size:11.5px;color:var(--muted)}
#main-search{padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;flex:1;max-width:380px;font-family:'Inter',sans-serif;transition:border-color .15s}
#main-search:focus{border-color:var(--tp)}
.stat-chips{display:flex;gap:8px;margin-left:auto}
.chip{font-size:10.5px;padding:3px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
#content{padding:20px 28px;flex:1}

/* ── SECTION ── */
.section{margin-bottom:32px;scroll-margin-top:62px}
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.sec-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sec-title{font-size:15px;font-weight:700;color:var(--navy)}
.sec-count{font-size:10px;background:var(--light);border:1px solid var(--border);padding:2px 8px;border-radius:8px;color:var(--muted);margin-left:auto}

/* ── SUB-SECTION ── */
.sub-sec{margin-bottom:18px}
.sub-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;padding:4px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}

/* ── TABLE ── */
.gtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.gtable thead tr{background:var(--navy)}
.gtable thead th{padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.05em;color:rgba(255,255,255,.85);text-align:left;white-space:nowrap}
.gtable thead th.th-desc{color:rgba(255,255,255,.6);font-weight:500}
.gtable thead th.th-tp{color:#93c5fd}
.gtable thead th.th-ws{color:#c4b5fd}
.gtable thead th.th-ap{color:#67e8f9}
.gtable thead th.th-am{color:#fca5a5}
.gtable thead th.th-sb{color:#86efac}
.gtable tbody tr{border-bottom:1px solid var(--border)}
.gtable tbody tr:last-child{border-bottom:none}
.gtable tbody tr:nth-child(even){background:#fafbfc}
.gtable tbody tr:hover{background:#f0f7ff}
.gtable tbody tr.hide{display:none}
.gtable td{padding:7px 10px;vertical-align:middle}
.td-desc{font-size:12.5px;color:var(--text);font-weight:500;min-width:160px;max-width:220px}
.td-cmd{font-size:11.5px}
.cmd-cell{display:flex;align-items:center;gap:5px;min-width:90px}
.cmd-tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:5px;cursor:pointer;display:inline-block;white-space:nowrap;transition:all .14s;border:1px solid transparent;line-height:1.4}
.cmd-tag:hover{filter:brightness(.88);transform:translateY(-1px)}
.cmd-tag.ok{filter:brightness(.75)!important}
.cmd-tag.tp{background:var(--tp-bg);color:var(--tp);border-color:var(--tp-light)}
.cmd-tag.ws{background:var(--ws-bg);color:var(--ws);border-color:var(--ws-light)}
.cmd-tag.ap{background:var(--ap-bg);color:var(--ap);border-color:var(--ap-light)}
.cmd-tag.am{background:var(--am-bg);color:var(--am);border-color:var(--am-light)}
.cmd-tag.sb{background:var(--sb-bg);color:var(--sb);border-color:var(--sb-light)}
.na{color:#cbd5e1;font-size:11px;font-style:italic;font-family:'JetBrains Mono',monospace}
.col-hidden{display:none}

/* ── WELCOME CARD ── */
.welcome-banner{background:linear-gradient(135deg,#1e3a8a,#1d4ed8,#0891b2);border-radius:12px;padding:28px 32px;margin-bottom:24px;color:#fff;display:flex;align-items:center;gap:24px}
.wb-text h1{font-size:20px;font-weight:800;margin-bottom:6px}
.wb-text p{color:rgba(255,255,255,.75);font-size:13px;line-height:1.7;max-width:520px}
.wb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex-shrink:0;min-width:260px}
.wb-stat{background:rgba(255,255,255,.12);border-radius:8px;padding:12px 16px;text-align:center}
.wb-stat .n{font-size:22px;font-weight:800}
.wb-stat .l{font-size:10px;color:rgba(255,255,255,.65);margin-top:1px;text-transform:uppercase;letter-spacing:.05em}

/* ── GDS HEADER BADGES ── */
.gds-header{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.gds-badge{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:default}
.gds-badge.tp{background:var(--tp-bg);color:var(--tp)}
.gds-badge.ws{background:var(--ws-bg);color:var(--ws)}
.gds-badge.ap{background:var(--ap-bg);color:var(--ap)}
.gds-badge.am{background:var(--am-bg);color:var(--am)}
.gds-badge.sb{background:var(--sb-bg);color:var(--sb)}

/* ── TOAST ── */
#toast{position:fixed;bottom:28px;right:28px;background:var(--navy);color:#fff;padding:9px 18px;border-radius:8px;font-size:12.5px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .25s;z-index:9999;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* ── NOTE BOX ── */
.note-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:9px 14px;font-size:12px;color:#92400e;margin-bottom:10px;line-height:1.6}

@media print{#sidebar{display:none}#main{margin-left:0}#topbar{display:none}.cmd-tag{cursor:default}}
</style>
</head>

const NAV_ORDER = ['signin','encode','decode','avail','flightinfo','sell','faredsip','pricing','storefare','pnr-mand','pnr-opt','retrieve','queues','profiles','news','hotels','cars','misc'];
const NAV_GROUPS = {
  'Basic & Availability':['signin','encode','decode','avail','flightinfo','sell'],
  'Fares & Tickets':['faredsip','pricing','storefare'],
  'PNR Fields':['pnr-mand','pnr-opt','retrieve'],
  'Operations':['queues','profiles','news'],
  'Hotels & Cars':['hotels','cars'],
  'Other':['misc']
};

// ── GDS STATE ──────────────────────────────────────────────────────────────
const GDS_COLS = ['tp','ws','ap','am','sb'];
const GDS_NAMES = {tp:'Travelport+',ws:'Worldspan',ap:'Apollo',am:'Amadeus',sb:'Sabre'};
let hiddenGDS = new Set();
let allRows = [];
let totalEntries = 0;

// ── BUILD UI ───────────────────────────────────────────────────────────────
function buildNav(){
  const nav = document.getElementById('sb-nav');
  let html = '';
  Object.entries(NAV_GROUPS).forEach(([grp, ids]) => {
    html += `<div class="nav-group">${grp}</div>`;
    ids.forEach(id => {
      const s = DATA[id];
      const cnt = Object.values(s.subs).flat().length;
      html += `<div class="nav-item" id="ni-${id}" onclick="scrollTo('${id}')"><span class="ni">${s.icon}</span>${s.title}<span class="badge">${cnt}</span></div>`;
    });
  });
  nav.innerHTML = html;
}

function buildContent(){
  const c = document.getElementById('content');
  let html = `<div class="welcome-banner">
    <div class="wb-text">
      <h1>✈ GDS Format Comparison Guide</h1>
      <p>A comprehensive training reference comparing commands across <strong>Travelport+</strong>, <strong>Worldspan</strong>, <strong>Apollo</strong>, <strong>Amadeus</strong>, and <strong>Sabre</strong>. Click any command to copy it instantly. Use the GDS filter pills to show/hide columns. Press Ctrl+F or use the search bar to find any command fast.</p>
    </div>
    <div class="wb-stats">
      <div class="wb-stat"><div class="n" id="wb-entries">—</div><div class="l">Total Entries</div></div>
      <div class="wb-stat"><div class="n">${Object.keys(DATA).length}</div><div class="l">Sections</div></div>
      <div class="wb-stat"><div class="n">5</div><div class="l">GDS Systems</div></div>
    </div>
  </div>`;

  NAV_ORDER.forEach(id => {
    const sec = DATA[id];
    let subCount = Object.values(sec.subs).flat().length;
    html += `<div class="section" id="sec-${id}">`;
    html += `<div class="sec-header">
      <div class="sec-icon" style="background:${sec.color}22;color:${sec.color}">${sec.icon}</div>
      <div class="sec-title">${sec.title}</div>
      <div class="sec-count">${subCount} commands</div>
    </div>`;
    if(sec.note) html += `<div class="note-box">💡 ${sec.note}</div>`;

    Object.entries(sec.subs).forEach(([subTitle, rows]) => {
      html += `<div class="sub-sec">`;
      if(Object.keys(sec.subs).length > 1){
        html += `<div class="sub-title">📌 ${subTitle}</div>`;
      }
      html += buildTable(id, subTitle, rows);
      html += `</div>`;
    });
    html += `</div>`;
  });

  c.innerHTML = html;

  // count rows
  allRows = Array.from(document.querySelectorAll('.cmd-row'));
  totalEntries = allRows.length;
  document.getElementById('wb-entries').textContent = totalEntries;
  document.getElementById('chip-rows').textContent = totalEntries + ' entries';
  document.getElementById('chip-sec').textContent = Object.keys(DATA).length + ' sections';
}

function buildTable(secId, subTitle, rows){
  let html = `<table class="gtable">
    <colgroup>
      <col style="width:20%">
      <col class="col-tp" style="width:16%">
      <col class="col-ws" style="width:16%">
      <col class="col-ap" style="width:16%">
      <col class="col-am" style="width:16%">
      <col class="col-sb" style="width:16%">
    </colgroup>
    <thead><tr>
      <th class="th-desc">Description</th>
      <th class="th-tp col-tp">Travelport+</th>
      <th class="th-ws col-ws">Worldspan</th>
      <th class="th-ap col-ap">Apollo</th>
      <th class="th-am col-am">Amadeus</th>
      <th class="th-sb col-sb">Sabre</th>
    </tr></thead>
    <tbody>`;

  rows.forEach((row, ri) => {
    const [desc, tp, ws, ap, am, sb] = row;
    const rowKey = `${secId}-${subTitle}-${ri}`;
    const allVals = [tp,ws,ap,am,sb].map(v=>v||'');
    const searchStr = (desc + ' ' + allVals.join(' ')).toLowerCase();
    html += `<tr class="cmd-row" data-search="${searchStr}" data-row="${rowKey}">`;
    html += `<td class="td-desc">${desc}</td>`;
    [[tp,'tp'],[ws,'ws'],[ap,'ap'],[am,'am'],[sb,'sb']].forEach(([val,cls]) => {
      html += `<td class="td-cmd col-${cls}">`;
      if(!val || val===null){
        html += `<span class="na">N/A</span>`;
      } else {
        html += `<div class="cmd-cell"><span class="cmd-tag ${cls}" onclick="copyCmd('${esc(val)}',this)" title="Click to copy">${esc(val)}</span></div>`;
      }
      html += `</td>`;
    });
    html += `</tr>`;
    totalEntries++;
  });

  html += `</tbody></table>`;
  return html;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function copyCmd(cmd, el){
  navigator.clipboard.writeText(cmd).then(() => {
    const orig = el.textContent;
    el.textContent = '✓';
    el.classList.add('ok');
    showToast(`Copied: ${cmd}`);
    setTimeout(() => { el.textContent = orig; el.classList.remove('ok'); }, 1200);
  });
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function scrollTo(id){
  document.getElementById('sec-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('ni-'+id)?.classList.add('active');
}

function filterNav(q){
  const v = q.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    el.style.display = (!v || el.textContent.toLowerCase().includes(v)) ? '' : 'none';
  });
}

// ── SEARCH ─────────────────────────────────────────────────────────────────
function doSearch(q){
  const v = q.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.cmd-row').forEach(row => {
    const m = !v || (row.dataset.search||'').includes(v);
    row.classList.toggle('hide', !m);
    if(m) shown++;
  });
  document.getElementById('chip-rows').textContent = v ? `${shown} results` : `${totalEntries} entries`;
  // hide/show sections
  NAV_ORDER.forEach(id => {
    const sec = document.getElementById('sec-'+id);
    if(!sec) return;
    sec.style.display = (v && !sec.querySelectorAll('.cmd-row:not(.hide)').length) ? 'none' : '';
  });
}

// ── GDS FILTER ─────────────────────────────────────────────────────────────
function toggleGDS(gds){
  if(hiddenGDS.has(gds)) hiddenGDS.delete(gds);
  else hiddenGDS.add(gds);

  const pill = document.querySelector(`.gds-pill.${gds}`);
  pill?.classList.toggle('off', hiddenGDS.has(gds));

  document.querySelectorAll(`.col-${gds}`).forEach(el => {
    el.classList.toggle('col-hidden', hiddenGDS.has(gds));
  });
}

// ── SCROLL SPY ─────────────────────────────────────────────────────────────
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting){
      const id = e.target.id.replace('sec-','');
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      const ni = document.getElementById('ni-'+id);
      if(ni){ ni.classList.add('active'); ni.scrollIntoView({block:'nearest'}); }
    }
  });
},{root:null,rootMargin:'-20% 0px -60% 0px',threshold:0});

// ── INIT ───────────────────────────────────────────────────────────────────
buildNav();
buildContent();
document.querySelectorAll('.section').forEach(s => io.observe(s));
</script>
