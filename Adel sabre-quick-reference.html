<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabre GDS — Quick Reference</title>
<style>
:root{--sb:230px;--navy:#0d1b3e;--red:#cc0000;--amber:#e8940a;--blue:#1d4ed8;--bg:#f5f4f0;--card:#fff;--border:#e0dcd4;--cmd:#12122a;--cmd-t:#e8e6f8;--text:#1a1a1a;--muted:#777;--green:#1e8a4c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
#sb{position:fixed;top:0;left:0;width:var(--sb);height:100vh;background:var(--navy);display:flex;flex-direction:column;overflow:hidden;z-index:100}
#sb-logo{background:var(--red);padding:14px 16px;flex-shrink:0}
#sb-logo .brand{color:#fff;font-size:18px;font-weight:800;letter-spacing:1px}
#sb-logo .sub{color:rgba(255,255,255,.75);font-size:10px;margin-top:2px;letter-spacing:.5px}
#sb-search{padding:10px 12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
#sb-search input{width:100%;padding:7px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:12px;outline:none}
#sb-search input::placeholder{color:rgba(255,255,255,.45)}
#sb-search input:focus{border-color:var(--amber)}
#sb-nav{flex:1;overflow-y:auto;padding:6px 0}
#sb-nav::-webkit-scrollbar{width:4px}
#sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.nav-grp{padding:8px 14px 3px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;padding:7px 14px;color:rgba(255,255,255,.72);font-size:12.5px;cursor:pointer;border-left:3px solid transparent;gap:8px;transition:all .15s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--amber)}
.nav-item .ic{width:18px;text-align:center;font-size:14px}
.nav-item .nc{margin-left:auto;font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:10px;color:rgba(255,255,255,.5)}
#sb-note{padding:10px 14px;font-size:10px;color:rgba(255,255,255,.35);border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;line-height:1.6}
#main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px}
#topbar .logo-text{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}
#main-search{flex:1;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:border-color .15s;background:var(--bg)}
#main-search:focus{border-color:var(--red)}
#res-count{font-size:12px;color:var(--muted);white-space:nowrap;min-width:90px;text-align:right}
#content{padding:20px 24px;flex:1}
.section{margin-bottom:28px;scroll-margin-top:60px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.sec-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.sec-title{font-size:15px;font-weight:700}
.sec-badge{font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--muted);margin-left:auto}
.ctable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;table-layout:fixed}
.ctable colgroup .c1{width:36%}.ctable colgroup .c2{width:47%}.ctable colgroup .c3{width:17%}
.ctable tr.header-row td{background:#f0ede5;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.06em;padding:7px 14px;border-top:1px solid var(--border)}
.ctable tr.header-row td:first-child{border-left:4px solid var(--amber)}
.ctable tr.cmd-row td{padding:7px 10px;vertical-align:middle;border-bottom:1px solid #f0ede8}
.ctable tr.cmd-row:last-child td{border-bottom:none}
.ctable tr.cmd-row:nth-child(even) td{background:#fafaf8}
.ctable tr.cmd-row:hover td{background:#f0ede4}
.ctable tr.cmd-row.hide{display:none}
.cmd-box{font-family:'Courier New',monospace;font-size:12.5px;background:var(--cmd);color:var(--cmd-t);padding:4px 9px;border-radius:5px;display:inline-block;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s;vertical-align:middle}
.cmd-box:hover{background:#1f1f40}
.cmd-box.ok{background:#0f3323;color:#7de09e}
.desc{font-size:12.5px;color:var(--text);line-height:1.4}
.btn-wrap{display:flex;flex-direction:column;gap:4px}
.cpbtn{font-size:10.5px;border:1px solid var(--border);background:var(--card);padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;transition:all .12s;width:100%;color:var(--muted)}
.cpbtn:hover{background:var(--amber);color:#fff;border-color:var(--amber)}
.fillbtn{font-size:10.5px;border:1px solid #3b82f6;background:#eff6ff;padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;transition:all .12s;width:100%;color:#1d4ed8;font-weight:600}
.fillbtn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.tool-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.tool-hdr{font-size:13px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #f0a500}
.tool-label{font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.tool-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tinput{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'Courier New',monospace;outline:none;transition:border-color .15s;text-transform:uppercase}
.tinput:focus{border-color:var(--amber)}
.tinput.sm{width:80px}.tinput.md{width:110px}.tinput.lg{flex:1;min-width:80px}
.tbtn{padding:8px 16px;background:var(--amber);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.tbtn:hover{opacity:.88}
.tout{background:#f5f4f0;border:1.5px dashed #c8c4bc;border-radius:6px;padding:9px 12px;font-size:13px;font-family:'Courier New',monospace;color:var(--cmd);min-height:36px;margin-top:4px;word-break:break-all;cursor:pointer}
.tout.result{border-color:var(--green);background:#f0faf4;color:var(--green)}
.tout.err{border-color:#dc3545;background:#fff5f5;color:#dc3545}
.note{background:#fffbe6;border:1px solid #f5c518;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#7a5c00;margin-bottom:10px}
/* MODAL */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center}
#mo.show{display:flex}
#mb{background:#fff;border-radius:14px;width:500px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#mhead{background:#0d1b3e;padding:18px 22px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
#mhead h2{color:#fff;font-size:16px;font-weight:700;margin:0}
#mhead .msub{color:rgba(255,255,255,.6);font-size:11px;margin-top:3px}
#mclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;transition:background .15s;line-height:1}
#mclose:hover{background:rgba(255,255,255,.3)}
#mbody{padding:20px 22px}
#mnote{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#1e40af;margin-bottom:16px;font-family:'Courier New',monospace;line-height:1.5}
.mf{margin-bottom:14px}
.mf label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:5px}
.mf input,.mf select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'Courier New',monospace;outline:none;transition:border-color .15s;background:#fff}
.mf select{text-transform:none}
.mf input:focus,.mf select:focus{border-color:var(--blue)}
.mf .hint{font-size:11px;color:var(--muted);margin-top:3px}
#mres{background:#1a1a2e;border-radius:8px;padding:14px 16px;margin:16px 0 0;font-family:'Courier New',monospace;font-size:15px;color:#e8e6f8;min-height:48px;word-break:break-all;display:flex;align-items:center;gap:10px;cursor:pointer}
#mres .rlabel{font-size:10px;color:rgba(255,255,255,.4);flex-shrink:0}
#mres-text{flex:1}
#mfooter{display:flex;gap:10px;padding:0 22px 20px}
#gbtn{flex:1;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
#gbtn:hover{background:#1e40af}
#cbtn{padding:11px 20px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;color:var(--text)}
#cbtn:hover{background:#e8e4da}
@media print{#sb,#topbar{display:none}#main{margin-left:0}.cpbtn,.fillbtn{display:none}.cmd-box{background:#eee;color:#000}}
</style>
</head>
<body>

<aside id="sb">
  <div id="sb-logo"><div class="brand">SABRE</div><div class="sub">GDS QUICK REFERENCE GUIDE</div></div>
  <div id="sb-search"><input id="sbq" placeholder="Jump to section..." oninput="filterNav(this.value)"></div>
  <nav id="sb-nav"></nav>
  <div id="sb-note">‡ = Sabre modifier key (¥ on some keyboards)<br>¤ = Sabre change/modify key<br>✏️ Fill = generate with your real data<br>Click any command to copy it</div>
</aside>

<div id="main">
  <div id="topbar">
    <span class="logo-text">✈ SABRE QUICK REF</span>
    <input id="main-search" placeholder="Search all commands and descriptions..." oninput="doSearch(this.value)" autocomplete="off">
    <span id="res-count"></span>
  </div>
  <div id="content"></div>
</div>

<div id="mo" onclick="if(event.target===this)closeModal()">
  <div id="mb">
    <div id="mhead">
      <div><h2 id="mtitle">Form</h2><div class="msub" id="msub"></div></div>
      <button id="mclose" onclick="closeModal()">✕</button>
    </div>
    <div id="mbody">
      <div id="mnote"></div>
      <div id="mfields"></div>
      <div id="mres" onclick="copyResult()"><span class="rlabel">CODE:</span><span id="mres-text">Fill in the fields above and click Generate</span></div>
    </div>
    <div id="mfooter">
      <button id="gbtn" onclick="genAndCopy()">⚡ Generate &amp; Copy</button>
      <button id="cbtn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
const FD={
  'adult-name':{
    t:'Adult Name Entry',s:'Format: -LASTNAME/FIRSTNAME TITLE',
    n:'-KADDOUR/ADEL MR   or   -SMITH/MARY MRS',
    f:[{id:'first',l:'First Name',p:'ADEL',u:1,r:1},{id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'title',l:'Title',sel:['MR','MRS','MS','DR','PROF','REV','SIR','HH','CAPT']}],
    b(v){return `-${v.last}/${v.first} ${v.title}`}
  },
  'child-name':{
    t:'Child (CNN) Name Entry',s:'Format: -LASTNAME/FIRSTNAME MSTR|MISS',
    n:'-KADDOUR/ADAM MSTR   or   -SMITH/EMMA MISS',
    f:[{id:'first',l:'First Name',p:'ADAM',u:1,r:1},{id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'gender',l:'Gender',sel:['MSTR  (Male / Boy)','MISS  (Female / Girl)']}],
    b(v){return `-${v.last}/${v.first} ${v.gender.split(' ')[0]}`}
  },
  'infant-name':{
    t:'Infant (INF) Name Entry',s:'Format: -I/LASTNAME/FIRSTNAME MSTR|MISS',
    n:'-I/KADDOUR/ADAM MSTR',
    f:[{id:'first',l:'First Name',p:'ADAM',u:1,r:1},{id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'gender',l:'Gender',sel:['MSTR  (Male / Boy)','MISS  (Female / Girl)']}],
    b(v){return `-I/${v.last}/${v.first} ${v.gender.split(' ')[0]}`}
  },
  'infant-ssr':{
    t:'Infant SSR with Date of Birth',s:'3INFT/LASTNAME/FIRSTNAME/DOB-AdultPaxNumber',
    n:'3INFT/KADDOUR/ADAM/15MAR23-1.1',
    f:[{id:'first',l:'First Name',p:'ADAM',u:1,r:1},{id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'dob',l:'Date of Birth (DDMMMYY)',p:'15MAR23',u:1,r:1,h:'Example: 15MAR23  or  20NOV24'},
       {id:'adult',l:'Adult Pax Number',p:'1.1',r:1,h:'The adult this infant travels with'}],
    b(v){return `3INFT/${v.last}/${v.first}/${v.dob}-${v.adult}`}
  },
  'pdt-cnn':{t:'Add Child Passenger Type',s:'PDTCNN-PaxNumber',n:'PDTCNN-2',
    f:[{id:'pax',l:'Passenger Number',p:'2',r:1,h:'Line number of the child in the PNR'}],b(v){return `PDTCNN-${v.pax}`}},
  'pdt-inf':{t:'Add Infant Passenger Type',s:'PDTINF-PaxNumber',n:'PDTINF-3',
    f:[{id:'pax',l:'Passenger Number',p:'3',r:1}],b(v){return `PDTINF-${v.pax}`}},
  'docs':{
    t:'Passport / ID DOCS SSR',s:'3DOCS/DocType/Issuer/DocNumber/Nationality/DOB/Gender/Expiry/Name-Pax',
    n:'3DOCS/P/EG/A12345678/EG/05JUN90/M/12AUG31/KADDOUR/ADEL-1.1',
    f:[{id:'dtype',l:'Document Type',sel:['P  (Passport)','I  (National ID / Resident Card)','A  (Alien Resident Card)','C  (Crew Member)']},
       {id:'issuer',l:'Issuer Country (2-letter ISO)',p:'EG',u:1,r:1,h:'EG=Egypt  SA=Saudi Arabia  GB=UK  AE=UAE  US=USA'},
       {id:'docno',l:'Document Number',p:'A12345678',u:1,r:1},
       {id:'nat',l:'Nationality (2-letter ISO)',p:'EG',u:1,r:1,h:'Same codes as issuer — EG SA GB AE US etc.'},
       {id:'dob',l:'Date of Birth (DDMMMYY)',p:'05JUN90',u:1,r:1,h:'Example: 05JUN90  or  15MAR00  or  20NOV04'},
       {id:'gender',l:'Gender',sel:['M  (Male)','F  (Female)']},
       {id:'exp',l:'Expiry Date (DDMMMYY)',p:'12AUG31',u:1,r:1,h:'Example: 12AUG31  or  01JAN35'},
       {id:'last',l:'Last Name',p:'KADDOUR',u:1,r:1},
       {id:'first',l:'First Name',p:'ADEL',u:1,r:1},
       {id:'pax',l:'Pax Number (e.g. 1.1)',p:'1.1',r:1}],
    b(v){return `3DOCS/${v.dtype.charAt(0)}/${v.issuer}/${v.docno}/${v.nat}/${v.dob}/${v.gender.charAt(0)}/${v.exp}/${v.last}/${v.first}-${v.pax}`}
  },
  'phone':{
    t:'Phone Field Entry',s:'Format: 9{number} {name}-{type}',n:'9201234567890 AHMED-H',
    f:[{id:'num',l:'Phone Number (include country code — no + sign)',p:'201234567890',r:1,h:'e.g. 201234567890 = Egypt mobile'},
       {id:'name',l:'Contact Name (optional)',p:'AHMED'},
       {id:'type',l:'Line Type',sel:['-H  Home / Hotel','-B  Business','-M  Mobile','-A  Agent']}],
    b(v){const t=v.type.split(' ')[0];return `9${v.num}${v.name?' '+v.name:''}${t}`}
  },
  'ctcm':{
    t:'SR CTCM — Mobile Phone',s:'3CTCM/CountryCode+Number-PaxNumber',
    n:'3CTCM/201234567890-1.1  (no + sign, country code + number together)',
    f:[{id:'cc',l:'Country Code (digits only)',p:'20',r:1,h:'20=Egypt  971=UAE  966=Saudi  44=UK  1=USA'},
       {id:'num',l:'Mobile Number (no spaces or dashes)',p:'1234567890',r:1},
       {id:'pax',l:'Pax Number',p:'1.1',r:1}],
    b(v){return `3CTCM/${v.cc}${v.num}-${v.pax}`}
  },
  'email-pe':{
    t:'Add Email Address to PNR',s:'PE‡email@domain.com‡',n:'PE‡adel.kaddour@gmail.com‡',
    f:[{id:'email',l:'Email Address',p:'adel.kaddour@gmail.com',u:0,r:1}],
    b(v){return `PE‡${v.email}‡`}
  },
  'ctce':{
    t:'SR CTCE — Email Address',s:'3CTCE/username//domain-PaxNumber',
    n:'3CTCE/ADEL.KADDOUR//GMAIL.COM-1.1  (note double //)',
    f:[{id:'local',l:'Email username (part before @)',p:'ADEL.KADDOUR',u:1,r:1},
       {id:'domain',l:'Email domain (part after @)',p:'GMAIL.COM',u:1,r:1,h:'e.g. GMAIL.COM  YAHOO.COM  OUTLOOK.COM'},
       {id:'pax',l:'Pax Number',p:'1.1',r:1}],
    b(v){return `3CTCE/${v.local}//${v.domain}-${v.pax}`}
  },
  'ttl':{
    t:'Ticket Time Limit',s:'7TAW{date}/  —  PNR placed on Q9',n:'7TAW14SEP/',
    f:[{id:'date',l:'Date (DDMTH)',p:'14SEP',u:1,r:1,h:'Example: 14SEP  or  01NOV  or  20DEC'}],
    b(v){return `7TAW${v.date}/`}
  },
  'ttl-q':{
    t:'Ticket Time Limit — Personal Queue',s:'7TAW{date}{queue}/  —  PNR placed on personal queue',n:'7TAW14SEP60/',
    f:[{id:'date',l:'Date (DDMTH)',p:'14SEP',u:1,r:1,h:'Example: 14SEP  or  01NOV'},
       {id:'q',l:'Personal Queue Number',p:'60',r:1}],
    b(v){return `7TAW${v.date}${v.q}/`}
  },
  'avail':{
    t:'Flight Availability',s:'1{date}{origin}{dest}  with optional airline / class',
    n:'130JUNBAHLHR  or  130JUNBAHLHR‡MS  or  130JUNBAHLHR-Y‡MS',
    f:[{id:'date',l:'Date (DDMTH)',p:'30JUN',u:1,r:1,h:'Example: 30JUN  or  01NOV  or  25DEC'},
       {id:'orig',l:'Origin — 3-letter city code',p:'CAI',u:1,r:1},
       {id:'dest',l:'Destination — 3-letter city code',p:'LHR',u:1,r:1},
       {id:'airline',l:'Airline Code (optional — leave blank for all)',p:'MS',u:1,h:'2-letter airline code e.g. MS EK QR BA'},
       {id:'cls',l:'Class of Service (optional)',p:'Y',u:1,h:'Leave blank for all classes — e.g. Y W C F M B'}],
    b(v){const al=v.airline?`‡${v.airline}`:'';const cl=v.cls?`-${v.cls}`:'';return `1${v.date}${v.orig}${v.dest}${cl}${al}`}
  },
  'qp':{
    t:'Queue Placement',s:'QP/{queue}/{PIC}',n:'QP/500/11',
    f:[{id:'q',l:'Queue Number',p:'500',r:1},{id:'pic',l:'PIC (Place In Category)',p:'11',r:1,h:'Numeric category code'}],
    b(v){return `QP/${v.q}/${v.pic}`}
  },
  'qp-ref':{
    t:'Queue Capture with Booking Reference',s:'QP/{RecordLocator}/{PIC}',n:'QP/G8VK501/11',
    f:[{id:'rl',l:'Record Locator / Booking Reference',p:'G8VK501',u:1,r:1},
       {id:'pic',l:'PIC',p:'11',r:1}],
    b(v){return `QP/${v.rl}/${v.pic}`}
  },
  'seat':{
    t:'Seat Selection',s:'4G{segment}/{seat}-{pax}',n:'4G1/14A-1.1',
    f:[{id:'seg',l:'Segment Number',p:'1',r:1},
       {id:'seat',l:'Seat Number',p:'14A',u:1,r:1,h:'e.g. 14A  22F  or  NW (non-smoking window)  NA (non-smoking aisle)'},
       {id:'pax',l:'Pax Number (optional — blank = all pax)',p:'1.1',h:'e.g. 1.1'}],
    b(v){const p=v.pax?`-${v.pax}`:'';return `4G${v.seg}/${v.seat}${p}`}
  },
  'ssr-meal':{
    t:'Special Service Request — Meal',s:'3{mealcode}{segment}-{pax}',n:'3MOML1-1.1',
    f:[{id:'meal',l:'Meal Type',sel:['VGML  Vegetarian (non-meat)','MOML  Muslim / Halal','KSML  Kosher','CHML  Child Meal','DBML  Diabetic','GFML  Gluten Free','LSML  Low Salt / Sodium','AVML  Asian Vegetarian','SFML  Seafood Meal','FPML  Fruit Plate','LCML  Low Calorie','SPML  Special Meal (specify)','BLML  Bland Meal','RVML  Raw Vegetarian']},
       {id:'seg',l:'Segment(s)',p:'1',r:1,h:'e.g. 1  or  1,2  or  2,3'},
       {id:'pax',l:'Pax Number(s)',p:'1.1',r:1,h:'e.g. 1.1  or  1.1,2.1'}],
    b(v){return `3${v.meal.split(' ')[0]}${v.seg}-${v.pax}`}
  },
  'fq':{
    t:'Fare Quote Builder',s:'FQ{origin}{dest}{date}{type}-{airline}',
    n:'FQCAILHR25JUN-MS   or   FQCAIJFK01NOVSP-MS‡R20NOV',
    f:[{id:'orig',l:'Origin — 3-letter city code',p:'CAI',u:1,r:1},
       {id:'dest',l:'Destination — 3-letter city code',p:'LHR',u:1,r:1},

function copyText(t,el){navigator.clipboard.writeText(t).then(()=>{if(!el)return;const o=el.textContent;el.textContent='✓ Copied';el.classList.add('ok');setTimeout(()=>{el.textContent=o;el.classList.remove('ok')},1400);})}

function buildSections(){
  const c=document.getElementById('content');let html='';
  SECTIONS.forEach(s=>{
    html+=`<div class="section" id="${s.id}">`;
    const cnt=s.cmds.filter(r=>!r[2]).length;
    html+=`<div class="sec-hdr"><span class="sec-dot" style="background:${s.color}"></span><span class="sec-title">${s.icon} ${s.title}</span><span class="sec-badge">${cnt} entries</span></div>`;
    html+=`<table class="ctable"><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><tbody>`;
    s.cmds.forEach((r,i)=>{
      if(r[2]){html+=`<tr class="header-row"><td colspan="3">${r[0]}</td></tr>`;return;}
      const rid=`r-${s.id}-${i}`,hf=!!CF[r[0]];
      html+=`<tr class="cmd-row" id="${rid}" data-cmd="${esc(r[0])}" data-desc="${esc(r[1])}">`;
      html+=`<td><span class="cmd-box" onclick="copyText(this.textContent.trim(),this)">${esc(r[0])}</span></td>`;
      html+=`<td><span class="desc">${esc(r[1])}</span></td>`;
      html+=`<td><div class="btn-wrap">${hf?`<button class="fillbtn" onclick="openForm('${esc(r[0])}')">✏️ Fill</button>`:''}`;
      html+=`<button class="cpbtn" onclick="copyText('${esc(r[0])}',document.querySelector('#${rid} .cmd-box'))">Copy</button></div></td></tr>`;
      allRows.push({id:rid,cmd:r[0].toLowerCase(),desc:r[1].toLowerCase()});
    });
    html+=`</tbody></table></div>`;
  });
  html+=buildTools();
  c.innerHTML=html;
}

function openForm(cmdKey){
  const fid=CF[cmdKey];if(!fid)return;
  const def=FD[fid];if(!def)return;curForm=def;
  document.getElementById('mtitle').textContent=def.t;
  document.getElementById('msub').textContent=def.s||'';
  document.getElementById('mnote').textContent=def.n||'';
  const mf=document.getElementById('mfields');
  mf.innerHTML=def.f.map(f=>{
    const u=f.u!==false?'style="text-transform:uppercase"':'';
    if(f.sel){
      const opts=f.sel.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      return `<div class="mf"><label>${f.l}${f.r?'<span style="color:#dc2626"> *</span>':''}</label><select id="mf-${f.id}">${opts}</select>${f.h?`<div class="hint">${f.h}</div>`:''}</div>`;
    }
    return `<div class="mf"><label>${f.l}${f.r?'<span style="color:#dc2626"> *</span>':''}</label><input id="mf-${f.id}" type="text" placeholder="${f.p||''}" ${f.max?`maxlength="${f.max}"`:''} ${u} autocomplete="off">${f.h?`<div class="hint">${f.h}</div>`:''}</div>`;
  }).join('');
  document.getElementById('mres-text').textContent='Fill in the fields above and click Generate';
  document.getElementById('mres').style.background='#1a1a2e';
  document.getElementById('mres').style.color='#e8e6f8';
  document.getElementById('gbtn').textContent='⚡ Generate & Copy';
  document.getElementById('mo').classList.add('show');
  setTimeout(()=>{mf.querySelector('input,select')?.focus();},100);
}

function genAndCopy(){
  if(!curForm)return;
  const vals={};let ok=true;
  curForm.f.forEach(f=>{
    const el=document.getElementById('mf-'+f.id);if(!el)return;
    let v=el.value.trim();
    if(f.u!==false)v=v.toUpperCase();
    if(f.r&&!v){el.style.borderColor='#dc2626';ok=false;}else el.style.borderColor='';
    vals[f.id]=v;
  });
  if(!ok){
    document.getElementById('mres-text').textContent='⚠️ Please fill in all required fields (marked *)';
    document.getElementById('mres').style.background='#3d0a0a';
    document.getElementById('mres').style.color='#f87171';return;
  }
  const result=curForm.b(vals);
  document.getElementById('mres-text').textContent=result;
  navigator.clipboard.writeText(result).then(()=>{
    document.getElementById('mres').style.background='#0f3323';
    document.getElementById('mres').style.color='#7de09e';
    const btn=document.getElementById('gbtn');
    btn.textContent='✅ Copied to Clipboard!';
    setTimeout(()=>{btn.textContent='⚡ Generate & Copy';},2000);
  }).catch(()=>{
    document.getElementById('mres').style.background='#2a2000';
    document.getElementById('mres').style.color='#fde047';
    document.getElementById('gbtn').textContent='Click the code above to copy';
    setTimeout(()=>{document.getElementById('gbtn').textContent='⚡ Generate & Copy';},3000);
  });
}

function gotoSec(id){
  document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
  document.getElementById('nav-'+id)?.classList.add('on');

function filterNav(q){
  const v=q.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{el.style.display=(!v||el.textContent.toLowerCase().includes(v))?'':'none';});
}

function doSearch(q){
  const v=q.trim().toLowerCase();let shown=0;
  allRows.forEach(r=>{
    const el=document.getElementById(r.id);if(!el)return;
    const m=!v||r.cmd.includes(v)||r.desc.includes(v);
    el.classList.toggle('hide',!m);if(m)shown++;
  });
  document.getElementById('res-count').textContent=v?`${shown} of ${allRows.length}`:`${allRows.length} total entries`;
  SECTIONS.forEach(s=>{const el=document.getElementById(s.id);if(!el)return;el.style.display=(v&&!el.querySelectorAll('.cmd-row:not(.hide)').length)?'none':'';});
}

const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function getLocalTime(){
  const city=(document.getElementById('t-city').value||'').toUpperCase().trim();
  const ce=document.getElementById('t-time-cmd'),re=document.getElementById('t-time-result');
  if(!city||city.length!==3){re.textContent='Enter a 3-letter city code';re.className='tout err';return;}
  ce.textContent=`T*${city}`;ce.className='tout';
  const tz=TZ[city];
  if(tz){re.textContent=`${city} → ${new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}`;re.className='tout result';}
  else{re.textContent=`${city} not in local database. Use T*${city} in Sabre.`;re.className='tout';}
}

let rC={};
function convertCurrency(){
  const from=(document.getElementById('c-from').value||'USD').toUpperCase();
  const amt=parseFloat(document.getElementById('c-amt').value)||100;
  const to=(document.getElementById('c-to').value||'KWD').toUpperCase();
  const ce=document.getElementById('c-cmd'),re=document.getElementById('c-result');
  ce.textContent=`DC‡${from}${amt.toFixed(2)}/${to}`;ce.className='tout';
  re.textContent='Fetching rates...';re.className='tout';
  if(rC[from]){applyR(rC[from],from,to,amt,re);return;}
  fetch(`https://open.er-api.com/v6/latest/${from}`).then(r=>r.json()).then(d=>{
    if(d.result==='success'){rC[from]=d.rates;applyR(d.rates,from,to,amt,re);}else throw 0;
  }).catch(()=>{re.textContent='Live rates unavailable. Use the Sabre command shown above.';re.className='tout';});
}
function applyR(rates,from,to,amt,el){
  if(rates[to]){el.textContent=`${amt} ${from} = ${(amt*rates[to]).toFixed(4)} ${to}  (Rate: 1 ${from} = ${rates[to].toFixed(6)} ${to})`;el.className='tout result';}
  else{el.textContent=`Currency code ${to} not found.`;el.className='tout';}
}

function calcDate(){
  const ds=document.getElementById('d-date').value.toUpperCase().trim();
  const days=parseInt(document.getElementById('d-days').value)||7;
  document.getElementById('d-cmd').textContent=`T¤${ds}‡${days}`;
  document.getElementById('d-cmd').className='tout';
  const m=ds.match(/^(\d{1,2})([A-Z]{3})$/);
  if(m){const mi=MONTHS.indexOf(m[2]);
    if(mi>=0){const d=new Date(new Date().getFullYear(),mi,parseInt(m[1]));d.setDate(d.getDate()+days);
      const re=document.getElementById('d-result');
      re.textContent=`${ds} + ${days} days = ${String(d.getDate()).padStart(2,'0')}${MONTHS[d.getMonth()]}${d.getFullYear()}`;
      re.className='tout result';return;}}
  document.getElementById('d-result').textContent='Enter date as DDMTH (e.g. 15APR)';
  document.getElementById('d-result').className='tout';
}

function encodeHelper(v){
  const val=v.trim().toUpperCase();
  const ce=document.getElementById('e-cmd'),re=document.getElementById('e-result');
  if(!val){ce.textContent='';re.textContent='';return;}
  if(val.length<=2){ce.textContent=`W/*${val}`;re.textContent='Airline code decode';}
  else if(val.length===3){ce.textContent=`W/*${val}`;re.textContent='Airport / City code decode — or HCCC/'+val+' for country decode';}
  else{ce.textContent=`W/-CC${val}`;re.textContent='Encoding city name — use W/-AP for airport, W/-AL for airline name';}
  ce.className='tout';re.className='tout';
}

buildSections();buildNav();
document.getElementById('res-count').textContent=`${allRows.length} total entries`;

new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
    const ni=document.getElementById('nav-'+e.target.id);
    if(ni){ni.classList.add('on');ni.scrollIntoView({block:'nearest'});}
  }});
},{root:null,rootMargin:'-20% 0px -60% 0px',threshold:0}).observe=((orig)=>function(el){orig.call(this,el);})(IntersectionObserver.prototype.observe);
document.querySelectorAll('.section').forEach(s=>{
  new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
      const ni=document.getElementById('nav-'+e.target.id);
      if(ni){ni.classList.add('on');ni.scrollIntoView({block:'nearest'});}
    }});
  },{root:null,rootMargin:'-20% 0px -60% 0px',threshold:0}).observe(s);
});
setInterval(()=>{const c=(document.getElementById('t-city')?.value||'').toUpperCase();if(c.length===3&&TZ[c]&&document.getElementById('t-time-result')?.className.includes('result'))getLocalTime();},5000);
